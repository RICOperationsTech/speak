  if (!v) return `<div class="card"><h3>Watch and learn <span class="tag">Optional</span></h3>
    ${d===30 ? "<p>The most powerful video today is your own: watch your Day 1 and Day 30 recordings back to back.</p>" : '<p class="sub">Pick one short video on today’s skill and steal one technique from it.</p>'}

    ${vidLink(v, w)}
    ${v.min > 25 ? '<p class="note" style="margin:8px 0 0">A longer watch. Save it for a weekend or your commute.</p>' : ""}

    <a class="link" href="${ytSearch(q)}" target="_blank" rel="noopener noreferrer">More on this skill</a></div></div>`;
}
function bindWatch(root){
  root.querySelectorAll("[data-watched]").forEach(b=>b.onclick = ()=>{

}

const pad2 = n => String(n).padStart(2,"0");
function prof(){ return state.profile || {}; }

function upcomingEvents(){
  const today = new Date(iso(new Date()) + "T00:00");
  return (prof().events || []).filter(e=>e.date).map(e=>({...e, days: Math.round((new Date(e.date + "T00:00") - today) / 864e5)}))
    .filter(e=>e.days >= -2).sort((a,b)=>a.days-b.days);
}
function prepStep(type, n){
  if (n < 0) return "How did it go? Log it as a real-world rep and write one lesson in your reflection.";
  if (type === "Interview"){
    if (n >= 7) return "Pick six STAR stories for this role (Interview mastery masterclass) and write one line for each.";
    if (n >= 4) return "Practise “Tell me about yourself” in 90 seconds, then run a mock interview with the AI.";
    if (n >= 2) return "Rehearse your three strongest STAR stories out loud and prepare three questions to ask them.";
    if (n === 1) return "Light review only: your opening answer and your questions. Lay out your clothes, sleep well.";
    return "Ten minutes before, do the “Speaking soon?” routine. Pause before each answer. You’ve prepared.";
  }
  if (type === "Networking event"){
    if (n >= 4) return "Write your 10-second “I help…” line, three open questions and a graceful exit line.";
    if (n >= 1) return "Practise an event conversation with the AI networking roleplay, out loud.";
    return "Set a goal: three real conversations and one follow-up message within 24 hours.";
  }
  if (n >= 7) return "Write your one-sentence point and three supports (PREP or headline structure).";
  if (n >= 5) return "Draft your hook and your close. Record a first run, even a rough one.";
  if (n >= 3) return "Rehearse with the timer, run it through the AI coach and prepare answers to three tough questions.";
  if (n === 2) return "Full rehearsal standing, recorded. Fix the one thing that bothers you most.";
  if (n === 1) return "Rehearse only your opening and close. Then rest.";
  return "Ten minutes before, run the “Speaking soon?” routine. Start slower than feels natural.";
}

/* Calendar */
function reminderTimes(){
  const t = (state.pref.remind || "21:00").split(":").map(Number), start = state.pref.start || addDays(1);
  const mins = state.pref.mins === 90 ? 75 : (state.pref.mins || 20);
  const s = new Date(start + "T00:00"); s.setHours(t[0], t[1], 0, 0);
  const e = new Date(s.getTime() + mins*60000);
  const f = d => iso(d).replace(/-/g,"") + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
  return {s:f(s), e:f(e), mins};
}
function gcalLink(){
  const {s, e} = reminderTimes();
  const tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || "";
  const details = "Your daily speaking session. Open Speak Mastery, choose your time and do today’s day. Then log your real-world reps.";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("Speak Mastery: daily session") +
    "&dates=" + s + "/" + e + "&details=" + encodeURIComponent(details) + "&recur=" + encodeURIComponent("RRULE:FREQ=DAILY;COUNT=90") + (tz ? "&ctz=" + encodeURIComponent(tz) : "");
}
function icsText(){
  const {s, e} = reminderTimes(), now = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Speak Mastery//EN","BEGIN:VEVENT","UID:speakmastery-"+Date.now()+"@local","DTSTAMP:"+now,"DTSTART:"+s,"DTEND:"+e,"RRULE:FREQ=DAILY;COUNT=90","SUMMARY:Speak Mastery: daily session","DESCRIPTION:Open Speak Mastery\\, choose your time and do today’s day.","BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Time to practise speaking","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function blobDownload(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function saveFile(name, text, type, out){
  if (dlFn) { try { await dlFn.save({filename:name, data:text}); out.textContent = "Saved."; } catch(e){ out.textContent = e && e.code === "declined" ? "Download cancelled." : "Download isn’t available here. Use “Copy backup text” instead."; } return; }
  if (window.claude) { out.textContent = "Download isn’t available here. Use “Copy backup text” instead."; return; }
  try { blobDownload(name, text, type); out.textContent = "Saved to your downloads."; } catch(e){ out.textContent = "Download failed. Use “Copy backup text” instead."; }
}

/* Backup */
function backupText(){ return JSON.stringify({app:"speak-mastery", v:1, exported:new Date().toISOString(), state}); }
function mergeState(d){
  ["done","doneAt","steps","notes","quiz","watched","ladder","proj","mc","srs","mini","scores","gym","crit"].forEach(k=>{ if (d[k] && typeof d[k] === "object") state[k] = Object.assign({}, state[k], d[k]); });
  Object.keys(d.quiz || {}).forEach(w=>{ state.quiz[w] = Math.max(+d.quiz[w]||0, +state.quiz[w]||0); });
  if (Array.isArray(d.reps)) { const seen = new Set(state.reps.map(r=>r.id)); d.reps.forEach(r=>{ if (r && !seen.has(r.id)) state.reps.push(r); }); state.reps.sort((a,b)=>a.id-b.id); }
  if (d.profile) state.profile = Object.assign({}, d.profile, state.profile && state.profile.title ? state.profile : {});
  if (d.pref) state.pref = Object.assign({}, d.pref, state.pref);
  state.coach = Math.max(state.coach, +d.coach || 0);
  state.delivery = unionById(state.delivery, d.delivery); state.human = unionById(state.human, d.human); if (Array.isArray(d.ana) && !state.ana.length) state.ana = d.ana; if (d.report && !state.report) state.report = d.report;
}
function restoreFrom(text, out){
  try {
    const obj = JSON.parse(text);
    if (!obj || obj.app !== "speak-mastery" || !obj.state) throw new Error("bad");
    mergeState(obj.state); save();
    viewDay = firstOpenDay(); renderEverything();

}

/* Text to speech */
const canSpeak = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function speakParts(parts, rate){
  if (!canSpeak) return;
  speechSynthesis.cancel();
  let i = 0;
  const next = ()=>{
    if (i >= parts.length) return;
    const [txt, gap] = parts[i++];
    if (!txt) { setTimeout(next, gap); return; }
    const u = new SpeechSynthesisUtterance(txt); u.rate = rate || 0.95; u.lang = "en-US";
    u.onend = ()=>setTimeout(next, gap || 0); speechSynthesis.speak(u);
  };
  next();
}
function speakText(t){ speakParts([[String(t).replace(/<[^>]+>/g,"").replace(/[“”*]/g,""), 0]]); }

      el.innerHTML = `<div class="frame"><b>${pts === max ? "Perfect judgment" : pts >= max/2 ? "Good instincts" : "Worth another try"}</b>You scored ${pts} of ${max}. ${pts === max ? "That’s how confident communicators handle it." : "Try it again and pick the response you’d want to be known for."}</div><div class="row"><button class="btn small" data-again>Try again</button></div>`;
      el.querySelector("[data-again]").onclick = ()=>{ step = 0; pts = 0; picked = null; draw(); }; return;
    }
    const st = sc.steps[step];
    el.innerHTML = `${step===0?`<p class="scenset">${sc.setup}</p>`:""}<b style="display:block;margin:6px 0 8px">${st.q}</b>

      ${picked!==null ? `<p class="explain">${["Not quite. ","Close. ","Excellent. "][st.o[picked][1]]}${st.o[picked][2]}</p><div class="row" style="margin-top:8px">${listenBtn(st.o.find(o=>o[1]===2)[0])}<button class="btn small" data-next>${step+1<sc.steps.length?"Next":"See result"}</button></div>` : ""}`;

/* Spot */
function mountSpot(el, start){
  let idx = start || 0, sel = new Set(), checked = false;
  const draw = ()=>{
    const item = SPOT[idx % SPOT.length];
    const toks = []; item.s.replace(/\[([^\]]+)\]|([^\s\[\]]+)/g, (m, tgt, w)=>{ if (!tgt && /^[^A-Za-z0-9’]+$/.test(w) && toks.length) toks[toks.length-1].tail = (toks[toks.length-1].tail||"") + w; else toks.push(tgt ? {t:tgt, target:true} : {t:w, target:false}); return m; });
    const targets = toks.filter(t=>t.target).length;
    let hits = 0, wrong = 0; toks.forEach((t,i)=>{ if (sel.has(i)) { if (t.target) hits++; else wrong++; } });
    el.innerHTML = `<p class="sub" style="margin:0 0 8px">Tap every word or phrase that weakens this sentence (${idx % SPOT.length + 1} of ${SPOT.length}).</p>
      <div class="toks">${toks.map((t,i)=>{ let c = "tok"; if (sel.has(i)) c += " sel"; if (checked){ if (t.target && sel.has(i)) c += " hit"; else if (t.target) c += " miss"; else if (sel.has(i)) c += " false"; } return `<button class="${c}" data-t="${i}" ${checked?"disabled":""}>${t.t}</button>${t.tail||""}`; }).join(" ")}</div>
      ${checked ? `<p class="explain">You found ${hits} of ${targets}${wrong?`, with ${wrong} false alarm${wrong>1?"s":""}`:""}. ${hits===targets && !wrong ? "Sharp eye." : "Dashed outlines show what you missed."}</p><div class="example"><b>Stronger</b>${item.fix}</div><div class="row" style="margin-top:8px">${listenBtn(item.fix)}<button class="btn small" data-next>Next sentence</button></div>`
        : `<div class="row" style="margin-top:10px"><button class="btn small amber" data-check>Check</button></div>`}`;
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick = ()=>{ const i = +b.dataset.t; sel.has(i) ? sel.delete(i) : sel.add(i); draw(); });
    const c = el.querySelector("[data-check]"); if (c) c.onclick = ()=>{ checked = true; if (hits===targets && !wrong) gymMark("spot", idx % SPOT.length, 1); draw(); };
    const n = el.querySelector("[data-next]"); if (n) n.onclick = ()=>{ idx++; sel = new Set(); checked = false; draw(); };
    bindListen(el);
  };
  draw();
}

function skillMap(){

const FILLERS = ["um+","uh+","erm","er","ah","hmm","you know","i mean","basically","literally","actually","so yeah"];
const HEDGES = ["just","maybe","perhaps","i think","i guess","i feel like","sorry","probably","kind of","sort of","a little bit","hopefully","does that make sense","i'm not sure","i’m not sure"];
const reFor = list => new RegExp("\\b(" + list.join("|") + ")\\b", "gi");
const LIKE_RE = /(,\s*like\b|\blike\s*,)/gi;
let sparQ = "", chatTurns = [], aiCtl = null;

function analyze(text, secs){
  const clean = text.trim();
  const words = clean ? clean.split(/\s+/).length : 0;
  const fillers = (clean.match(reFor(FILLERS)) || []).length + (clean.match(LIKE_RE) || []).length;
  const hedges = (clean.match(reFor(HEDGES)) || []).length;
  const sentences = clean.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const avg = sentences.length ? Math.round(words / sentences.length) : 0;
  const longest = sentences.reduce((m,s)=>Math.max(m, s.split(/\s+/).length), 0);
  const wpm = secs > 0 ? Math.round(words / (secs/60)) : null;
  const tips = [];
  const first = (sentences[0] || "").toLowerCase();
  if (/^(so|um|uh|well|okay|ok)\b/.test(first)) tips.push("You open with a filler word. Start with your point or a hook instead.");
  if (/(today i'?m going to|today i’m going to|i'?m going to talk|i’m going to talk|my name is)/.test(first)) tips.push("Your opening announces the topic. Try a question, a surprising fact or the first line of a story.");
  const last = (sentences[sentences.length-1] || "").toLowerCase();
  if (/(so yeah|that'?s it|that’s it|any questions|i guess)$/.test(last)) tips.push("Your ending trails off. Close with a one-sentence summary or a clear ask.");
  if (/\?\s*$/.test(clean) && !/[.!]\s*$/.test(clean)) tips.push("You end on a question. Unless it’s deliberate, finish with a statement.");
  if (hedges >= 3) tips.push("Several hedges (" + hedges + "). Cut “just,” “maybe” and “I think” where you mean it.");
  if (fillers >= 3) tips.push("Fillers showed up " + fillers + " times. Replace each with a silent pause.");
  if (longest > 35) tips.push("Your longest sentence has " + longest + " words. Break long sentences into two.");
  if (sentences.length <= 1 && words > 40) tips.push("No sentence breaks detected. Add punctuation (or say “period” while dictating) for sentence stats.");
  if (wpm && wpm > 175) tips.push("About " + wpm + " words per minute is fast. Aim for 130–160 and use pauses.");
  if (wpm && wpm < 110) tips.push("About " + wpm + " words per minute is slow. A little more pace will sound more energetic.");
  if (!tips.length && words) tips.push("Clean language. Now focus on delivery: pace, pauses and a strong close.");
  let html = esc(clean);
  html = html.replace(reFor(FILLERS), m=>`<mark class="f">${m}</mark>`).replace(LIKE_RE, m=>`<mark class="f">${m}</mark>`);
  html = html.replace(reFor(HEDGES), m=>`<mark class="h">${m}</mark>`);
  return {words, fillers, hedges, avg, longest, wpm, tips, html, sentences:sentences.length};
}

      <div class="prompt" id="pText">Tap for a prompt, then start talking within 3 seconds.</div>
      <button class="btn" id="pNew">New prompt</button>
    </div>
    <div class="card"><h3>Filler counter</h3>
      <p class="sub">Tap for every “um,” “uh,” “like” or “you know” while you speak or watch your recording.</p>
      <button class="tap" id="fTap" aria-label="Add a filler">0<span>tap to count</span></button>
      <div class="row" style="margin-top:10px"><button class="btn ghost small" id="fReset">Reset count</button></div>
    </div>
    <div class="card"><h3>Breathing pacer</h3>
      <div class="row" id="pmodes">${Object.entries(PACER).map(([k,v])=>`<button class="chip" data-m="${k}" aria-pressed="${k===pacerMode}">${v.n}</button>`).join("")}</div>
      <div class="pacer"><div class="orbbox"><div class="orb" id="orb"></div></div><div class="pacertext" id="ptext" aria-live="polite">Ready<small></small></div></div>
      <div class="row"><button class="btn" id="pGo">Start breathing</button></div>
    </div>`;
  let twI = 0; $("#twNew").onclick = ()=>{ twI = (twI + 1 + Math.floor(Math.random()*(TWISTERS.length-1))) % TWISTERS.length; $("#twText").textContent = TWISTERS[twI]; };
  renderTimer();
  $("#routine").innerHTML = `<ol class="steps">${ROUTINE.map(r=>`<li>${r[0]}</li>`).join("")}</ol><p class="note">Then on stage: pause, find one friendly face, and start slower than feels natural.</p>`;
  $("#rGo").onclick = runRoutine;
  el.querySelectorAll("[data-p]").forEach(c=>c.onclick = ()=>{ pSet = c.dataset.p; el.querySelectorAll("[data-p]").forEach(x=>x.setAttribute("aria-pressed", String(x===c))); });
  $("#pNew").onclick = ()=>{
    const list = pSet === "mine" ? myPrompts() : PROMPTS[pSet]; let p;
    do { p = list[Math.floor(Math.random()*list.length)]; } while (p === lastPrompt && list.length > 1);
    lastPrompt = p; $("#pText").textContent = p;
  };
  $("#fTap").onclick = ()=>{ fillerN++; $("#fTap").firstChild.nodeValue = fillerN; };
  $("#fReset").onclick = ()=>{ fillerN = 0; $("#fTap").firstChild.nodeValue = 0; };
  el.querySelectorAll("[data-m]").forEach(c=>c.onclick = ()=>{ pacerMode = c.dataset.m; stopPacer(); el.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed", String(x===c))); });
  $("#pGo").onclick = ()=>{ pacerOn ? stopPacer() : startPacer(); };
}
function renderTimer(){
  const b = $("#timerBox"); if (!b) return;
  b.innerHTML = `<div class="row">${[30,60,90,120,180].map(s=>`<button class="chip" data-s="${s}" aria-pressed="${s===tSet}">${s<60?s+"s":(s/60)+" min"}</button>`).join("")}</div>
    <div class="timer ${tLeft<=0?"over":""}" id="tDisp" aria-live="polite">${fmt(tLeft)}</div>
    <div class="row"><button class="btn" id="tGo">${tRun?"Pause":"Start"}</button><button class="btn ghost" id="tReset">Reset</button></div>
    <p class="note" style="margin:8px 0 0">When it hits zero it keeps counting up, so you can see how far over you went.</p>`;
  b.querySelectorAll(".chip").forEach(c=>c.onclick = ()=>setTimer(+c.dataset.s));
  $("#tGo").onclick = ()=>{ tRun ? stopTimer() : startTimer(); renderTimer(); };
  $("#tReset").onclick = ()=>{ stopTimer(); tLeft = tSet; renderTimer(); };
}
function startTimer(){
  tRun = setInterval(()=>{
    tLeft--;
    const d = $("#tDisp"); if (d){ d.textContent = fmt(tLeft); d.classList.toggle("over", tLeft <= 0); }
    if (tLeft === 0){ try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e) {} }
  }, 1000);
}
function stopTimer(){ clearInterval(tRun); tRun = null; }
function startPacer(){
  pacerOn = true; $("#pGo").textContent = "Stop";
  const phases = PACER[pacerMode].p; let i = 0, cycles = 0;
  const orb = $("#orb"), txt = $("#ptext");
  const step = ()=>{
    if (!pacerOn) return;
    const [label, secs, scale] = phases[i];
    orb.style.transitionDuration = secs + "s"; orb.style.transform = "scale(" + scale + ")";
    let left = secs; txt.innerHTML = ""; txt.append(document.createTextNode(label)); const sm = document.createElement("small"); sm.textContent = left; txt.appendChild(sm);
    const iv = setInterval(()=>{ left--; if (left > 0) sm.textContent = left; }, 1000); pacerT.push(iv);
    pacerT.push(setTimeout(()=>{ clearInterval(iv); i = (i+1) % phases.length; if (i===0) cycles++; if (cycles >= 6){ stopPacer(); txt.innerHTML = "Done<small>✓</small>"; return; } step(); }, secs*1000));
  };
  step();
}
function stopPacer(){
  pacerOn = false; pacerT.forEach(t=>{ clearTimeout(t); clearInterval(t); }); pacerT = [];
  const orb = $("#orb"); if (orb){ orb.style.transitionDuration = "1s"; orb.style.transform = "scale(.55)"; }
  const t = $("#ptext"); if (t) t.innerHTML = "Ready<small></small>";
  const g = $("#pGo"); if (g) g.textContent = "Start breathing";
}
function runRoutine(){
  if (rRun) { clearInterval(rRun); rRun = null; }
  let i = 0, left = ROUTINE[0][1];
  const box = $("#routine"); $("#rGo").textContent = "Restart the routine";
  const draw = ()=>{
    const [txt, secs] = ROUTINE[i];
    box.innerHTML = `<div class="routine"><span class="sub" style="color:var(--stage-muted)">Step ${i+1} of ${ROUTINE.length} · ${left}s</span><div class="rstep"></div><div class="rbar"><span style="width:${(1-left/secs)*100}%"></span></div>
      <div class="row" style="margin-top:12px"><button class="btn small amber" id="rNext">${i===ROUTINE.length-1?"Finish":"Next step"}</button></div></div>`;
    box.querySelector(".rstep").textContent = txt;
    $("#rNext").onclick = advance;
  };
  const advance = ()=>{
    i++;
    if (i >= ROUTINE.length){ clearInterval(rRun); rRun = null; box.innerHTML = `<div class="routine"><div class="rstep">You’re ready.</div><p style="margin:0">Walk on, pause, find one friendly face, and start slower than feels natural.</p></div>`; return; }
    left = ROUTINE[i][1]; draw();
  };
  draw();
  rRun = setInterval(()=>{ left--; if (left <= 0) advance(); else draw(); }, 1000);
}

/* =========================================================
   PROGRESS
   ========================================================= */
function radarSVG(){
  const cx = 170, cy = 150, R = 105;
  const pt = (i, v)=>{ const a = (-90 + i*72) * Math.PI/180; return [cx + Math.cos(a)*R*v/5, cy + Math.sin(a)*R*v/5]; };
  let g = "";
  for (let lv=1; lv<=5; lv++) g += `<polygon points="${DIMS.map((_,i)=>pt(i,lv).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  DIMS.forEach((m,i)=>{ const [x,y] = pt(i,5); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly] = pt(i,6.3); g += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="var(--muted)" font-family="Atkinson Hyperlegible, sans-serif">${m.n}</text>`; });
  const scored = CHECKS.filter(d=>{ const s = state.scores[d]; return s && DIMS.some(m=>s[m.k]); });
  const poly = (d, fill, stroke, dash)=>{ const s = state.scores[d]; return `<polygon points="${DIMS.map((m,i)=>pt(i, s[m.k]||0).join(",")).join(" ")}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" ${dash?'stroke-dasharray="5 4"':""}/>`; };
  if (scored.length) g += poly(scored[0], "none", "var(--indigo)", true);
  if (scored.length > 1) g += poly(scored[scored.length-1], "rgba(245,181,71,.35)", "var(--glow)", false);
  else if (scored.length === 1) g += poly(scored[0], "rgba(179,166,247,.18)", "var(--indigo)", false);
  return {svg:`<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Your scores across five skills">${g}</svg>`, scored};
}
function renderProgress(){
  const el = $("#progress");
  const x = xp(), r = rankOf(x), cur = state.scores[scoreDay] || {};
  const rad = radarSVG();
  let h = `<div class="card"><div class="ranks"><div><span class="sub">Your rank</span><div class="rankname">${r.cur[1]}</div></div><div style="text-align:right"><span class="sub">XP</span><div class="rankname">${x}</div></div></div>
    <div class="stats four">
      <div class="stat"><b>${doneCount()}</b><span>days done</span></div>
      <div class="stat"><b>${streak()}</b><span>day streak</span></div>
      <div class="stat"><b>${Object.keys(state.quiz).length}/4</b><span>tests taken</span></div>
      <div class="stat"><b>${state.coach}</b><span>coach sessions</span></div>
    </div>
    <div class="stats four">
      <div class="stat"><b>${Object.keys(state.ladder).length}/12</b><span>courage rungs</span></div>
      <div class="stat"><b>${state.reps.length}</b><span>real reps</span></div>
      <div class="stat"><b>${Object.keys(state.mc).length}/${MC.length}</b><span>master­classes</span></div>
      <div class="stat"><b>${PROJECTS.filter(projDone).length}/${PROJECTS.length}</b><span>projects</span></div>
    </div>
    <div class="stats four">
      <div class="stat"><b>${state.delivery.length ? Math.max(...state.delivery.map(x=>x.score)) : "–"}</b><span>best delivery</span></div>
      <div class="stat"><b>${state.delivery.length ? state.delivery[state.delivery.length-1].score : "–"}</b><span>latest delivery</span></div>
      <div class="stat"><b>${state.human.length}</b><span>human feedback</span></div>
      <div class="stat"><b>${Object.values((state.gym||{}).scen||{}).filter(v=>v===2).length}/${SCEN.length}</b><span>scenarios aced</span></div>
    </div>
    <p class="note" style="margin:0">Earn XP for each day (100), scored checkpoint (50), test passed (75), reflection (20), coach session (15), video (10), delivery recording (15), human feedback (40), real-world rep (5), courage rung (30), masterclass (60) and finished project (150). ${r.next ? (r.next[0]-x) + " XP to " + r.next[1] + "." : "You’ve reached the top rank."}</p></div>`;

  h += skillMapHTML() + reportHTML();
  h += `<div class="card"><h3>Checkpoint shape</h3>
    ${rad.scored.length ? `<div class="radarwrap">${rad.svg}</div><div class="legend"><span><i style="background:var(--indigo)"></i>Day ${rad.scored[0]}</span>${rad.scored.length>1?`<span><i style="background:var(--glow)"></i>Day ${rad.scored[rad.scored.length-1]}</span>`:""}</div>`
      : `<p class="note">Score your Day 1 recording below and your skill shape appears here. Each checkpoint adds a new layer so you can see yourself grow.</p>`}
  </div>`;

  h += `<div class="card"><h3>Score a recording</h3>
    <p class="sub">Rate 1 (needs work) to 5 (excellent). Be honest, not harsh.</p>
    <div class="row">${CHECKS.map(d=>`<button class="chip" data-cp="${d}" aria-pressed="${d===scoreDay}">Day ${d}</button>`).join("")}</div>`;
  DIMS.forEach(m=>{
    h += `<div class="dim"><b>${m.n}</b><span class="hint">${m.h}</span>
      <div class="rate" role="group" aria-label="${m.n}">${[1,2,3,4,5].map(v=>`<button data-k="${m.k}" data-v="${v}" aria-pressed="${cur[m.k]===v}">${v}</button>`).join("")}</div></div>`;
  });
  h += `<div class="dim"><b>Fillers</b><span class="hint">Total “um / uh / like” in the recording</span>
    <div style="margin-top:6px"><input type="number" min="0" inputmode="numeric" id="fillIn" value="${cur.fillers ?? ""}" aria-label="Filler count" style="width:100px"></div></div></div>`;

  h += `<div class="card"><h3>Checkpoint totals</h3><div class="bars">`;
  CHECKS.forEach(d=>{
    const s = state.scores[d] || {};
    const vals = DIMS.map(m=>s[m.k]).filter(v=>v);
    const tot = vals.reduce((a,b)=>a+b,0);
    h += `<div class="bar"><span>Day ${d}</span><span class="track"><span class="fill" style="width:${tot/25*100}%"></span></span><span class="v">${vals.length?tot+"/25":"–"}${s.fillers!==undefined?"":""}</span></div>`;
  });
  h += `</div>`;
  const fl = CHECKS.filter(d=>(state.scores[d]||{}).fillers !== undefined);
  if (fl.length > 1) h += `<p class="note" style="margin-top:10px">Fillers: ${fl.map(d=>"Day "+d+": "+state.scores[d].fillers).join(", ")}.</p>`;
  h += `</div>`;

  const notes = Object.entries(state.notes).filter(([k,v])=>v && v.trim()).sort((a,b)=>+a[0]-+b[0]);
  h += `<div class="card"><h3>Your journal</h3>${notes.length ? `<p class="sub">Every reflection you’ve written, in one place. Reread it at each checkpoint; patterns jump out.</p>${notes.map(([k,v])=>`<details class="jr"><summary><b>Day ${k}</b> ${esc(getDay(+k).t)}</summary><p style="white-space:pre-wrap;margin:8px 0 0">${esc(v)}</p></details>`).join("")}` : `<p class="sub" style="margin:0">Your daily reflections will collect here. Write a few honest lines at the end of each session.</p>`}</div>`;
  h += `<div class="card"><h3>Weekly tests</h3><div class="bars">`;
  [1,2,3,4].forEach(w=>{ const q = state.quiz[w];
    h += `<div class="bar"><span>Week ${w}</span><span class="track"><span class="fill" style="width:${(q||0)/5*100}%"></span></span><span class="v"><button class="btn ghost small" data-quiz="${w}" style="padding:4px 10px">${q!==undefined?q+"/5":"Take"}</button></span></div>`; });
  h += `</div></div>`;
  el.innerHTML = h;

  const rb = $("#reportBtn"); if (rb) rb.onclick = coachReport;
  if (state.report) { const rbx = el.querySelector("#reportBox .rewrite"); if (rbx) rbx.textContent = state.report.text; }
  el.querySelectorAll("[data-cp]").forEach(c=>c.onclick = ()=>{ scoreDay = +c.dataset.cp; renderProgress(); });
  el.querySelectorAll(".rate button").forEach(b=>b.onclick = ()=>{
    const s = state.scores[scoreDay] = {...(state.scores[scoreDay]||{})};
    s[b.dataset.k] = +b.dataset.v; save(); renderProgress(); renderHero();
  });
  $("#fillIn").onchange = e=>{
    const s = state.scores[scoreDay] = {...(state.scores[scoreDay]||{})};
    if (e.target.value === "") delete s.fillers; else s.fillers = Math.max(0, parseInt(e.target.value,10) || 0);
    save(); renderProgress();
  };
  el.querySelectorAll("[data-quiz]").forEach(b=>b.onclick = ()=>openQuiz(+b.dataset.quiz));
}

function renderLibrary(){
  const part = core => LIB.filter(c=>c.core===core).map(c=>{
    const done = c.items.filter(i=>APP_DONE.has(i)).length;
    return `<details class="cat"><summary><span>${c.name}</span><span class="c">${c.items.length} lessons${done?", "+done+" done":""}</span></summary><ul>${
      c.items.map(i=>`<li><span>${i}</span>${IN_PLAN[i]?`<span class="mk in">Day ${IN_PLAN[i]}</span>`:APP_DONE.has(i)?`<span class="mk app">Done in app</span>`:`<span class="mk">Month 2</span>`}</li>`).join("")
    }</ul></details>`;
  }).join("");
  $("#library").innerHTML = `<p class="note" style="margin-top:0">All 33 screenshots, organized. “Day” means it’s in your 30-day plan, “Done in app” is what you’ve already finished, and “Month 2” is next.</p>
    <h2 class="libhead">Speaking and influence</h2>${part(true)}
    <h2 class="libhead">Support skills</h2>
    <p class="note" style="margin-top:0">Clear thinking makes clear speaking. Use these after the month, or when a drill runs short.</p>${part(false)}`;

/* =========================================================
   TABS & BOOT
   ========================================================= */
function showTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.tab===id || (id==="quiz" && t.dataset.tab==="plan"))));
  document.querySelectorAll("section[role=tabpanel]").forEach(s=>s.hidden = s.id !== id);
  const tb = document.querySelector(`.tab[data-tab="${id}"]`); $("#moreTog").classList.toggle("active", !!(tb && tb.classList.contains("sec")) ); closeSheet();
  try { stopDelivery(); } catch(e){}
  stopMeter(); if (canSpeak) speechSynthesis.cancel();
}
document.querySelectorAll(".tab[data-tab]").forEach(t=>t.addEventListener("click",()=>{ showTab(t.dataset.tab); if (t.dataset.tab==="gym") renderGym(); }));
function renderAll(){ renderHero(); renderToday(); renderPlan(); renderProgress(); }
renderAll(); renderVideos(); renderCoach(); renderToolkit(); renderPlaybook(); renderLibrary(); renderMasterclasses(); renderRealWorld(); renderWisdom(); renderMe(); renderGym(); applyFocus();
$("#focusExit").onclick = toggleFocus;
$("#moreTog").onclick = openSheet;
$("#sheet").addEventListener("click", e=>{ if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e=>{ if (e.key === "Escape") closeSheet(); });

(async ()=>{
  if (!window.claude || !window.claude.use) { sampleFn = false; applyAI(); return; }
  window.claude.use("downloads").then(x=>{ dlFn = x || null; }).catch(()=>{});
  window.claude.use("sample").then(s=>{ sampleFn = s || false; aiReady = !!s; applyAI(); }).catch(()=>{ sampleFn = false; applyAI(); });
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    const localHad = Object.keys(state.done).length || Object.keys(state.scores).length || Object.keys(state.notes).length;
    if (snap.exists){
      const d = JSON.parse(JSON.stringify(snap.data() || {}));
      ["done","doneAt","steps","notes","quiz","watched","ladder","proj","mc","srs","mini","gym","crit"].forEach(k=>{ state[k] = Object.assign({}, state[k], d[k] || {}); });
      if (d.profile) state.profile = Object.assign({}, state.profile, d.profile);
      if (d.pref) state.pref = Object.assign({}, d.pref, state.pref);
      if (Array.isArray(d.reps)) { const seen = new Set(state.reps.map(r=>r.id)); d.reps.forEach(r=>{ if (!seen.has(r.id)) state.reps.push(r); }); state.reps.sort((a,b)=>a.id-b.id); }
      Object.keys(d.quiz || {}).forEach(w=>{ state.quiz[w] = Math.max(+d.quiz[w]||0, +state.quiz[w]||0); });
      const merged = Object.assign({}, state.scores);
      Object.keys(d.scores || {}).forEach(k=>{ merged[k] = Object.assign({}, merged[k] || {}, d.scores[k]); });
      state.scores = merged;
      state.coach = Math.max(state.coach, +d.coach || 0);
      state.delivery = unionById(state.delivery, d.delivery); state.human = unionById(state.human, d.human); if (Array.isArray(d.ana) && !state.ana.length) state.ana = d.ana; if (d.report && !state.report) state.report = d.report;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
      viewDay = firstOpenDay();
      renderAll();
    }
    remote = ref; setSync(true);
    if (localHad) flush();
  } catch(e) { /* device storage only */ }
})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
