<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 90-day interactive course in confident speaking, presence and influence.">
<meta name="theme-color" content="#1C1828">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak">
<title>Speak Mastery: the 90-day speaking course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F0F6; --surface:#FFFFFF; --ink:#1F1B2D; --muted:#5E596F; --line:#DCD9E6;
  --amber:#8F5300; --glow:#F5B547; --indigo:#4A3AA8; --indigo-soft:#E8E4F8;
  --stage:#1C1828; --stage-ink:#F4EFFA; --stage-muted:#B9B1CC;
  --good:#22704A; --good-soft:#E1F3E8; --bad:#A3261E; --bad-soft:#FBE6E3;
  --mark-f:#FCE3B4; --mark-h:#E3DDFA;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121C; --surface:#1F1C2A; --ink:#EFEBF7; --muted:#A8A2BA; --line:#34304A;
    --amber:#F2B655; --indigo:#B3A6F7; --indigo-soft:#2A2545; --stage:#0E0C15;
    --good:#6BCB8F; --good-soft:#18301F; --bad:#F2A097; --bad-soft:#3A1D1A;
    --mark-f:#5A4012; --mark-h:#3A3264; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121C; --surface:#1F1C2A; --ink:#EFEBF7; --muted:#A8A2BA; --line:#34304A;
  --amber:#F2B655; --indigo:#B3A6F7; --indigo-soft:#2A2545; --stage:#0E0C15;
  --good:#6BCB8F; --good-soft:#18301F; --bad:#F2A097; --bad-soft:#3A1D1A;
  --mark-f:#5A4012; --mark-h:#3A3264; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:700px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px;border-radius:6px}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}

/* Stage hero */
.stage{position:relative;overflow:hidden;background:var(--stage);color:var(--stage-ink);border-radius:24px;padding:20px 20px 18px;isolation:isolate}
.stage::before{content:"";position:absolute;z-index:-1;left:50%;top:-45%;width:140%;height:155%;transform:translateX(-50%);
  background:radial-gradient(ellipse 36% 58% at 50% 18%, rgba(245,181,71,.55), rgba(245,181,71,.12) 55%, transparent 75%);}
.stagetop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--stage-muted)}
.stagetop b{font-family:var(--display);color:var(--stage-ink);font-size:16px;white-space:nowrap}
.stagetop .streak{font-size:14px;text-align:right}
.streak{white-space:nowrap}
.daynum{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,116px);line-height:.9;letter-spacing:-.03em;margin-top:14px}
.daynum small{display:block;font-size:17px;font-weight:500;letter-spacing:0;color:var(--stage-muted);margin-bottom:6px}
.stage .theme{font-size:17px;margin-top:10px;max-width:36ch}
.lamps{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
.lampweek{display:flex;gap:6px;flex-wrap:wrap}
.lamp{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:transparent;padding:0}
.lamp.done{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px 2px rgba(245,181,71,.55)}
.lamp.current{outline:2px solid var(--stage-ink);outline-offset:2px}
.lamp.lit{animation:light .8s ease-out}
@keyframes light{0%{transform:scale(.6);box-shadow:0 0 0 0 rgba(245,181,71,0)}60%{transform:scale(1.3);box-shadow:0 0 24px 9px rgba(245,181,71,.75)}100%{transform:scale(1)}}
.xp{margin-top:16px}
.xpbar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--glow);border-radius:99px;transition:width .6s ease}
.xplabel{display:flex;justify-content:space-between;font-size:14px;color:var(--stage-muted);margin-top:6px}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:14px -16px 0;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section[hidden]{display:none}
section{padding-top:14px}

/* Cards & shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font-size:20px;font-weight:700;margin-bottom:8px}
.sub{color:var(--muted);font-size:15px}
.mins{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:none;border-radius:12px;padding:11px 16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px}
.btn.amber{background:var(--glow);color:#2A1A00}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:15px}
.tag{display:inline-block;font-size:13px;border-radius:999px;padding:2px 9px;background:var(--indigo-soft);color:var(--indigo);font-weight:700;vertical-align:middle;font-family:var(--body)}
.note{font-size:15px;color:var(--muted)}

/* Today */
.daynav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:15px}
.daytitle{font-size:30px;font-weight:800;letter-spacing:-.015em}
.weekline{color:var(--muted);font-size:15px;margin:6px 0 12px}
.big{font-family:var(--display);font-size:21px;font-weight:500;line-height:1.3;border-left:4px solid var(--glow);padding:2px 0 2px 14px;margin:0 0 18px}
.stepcard{position:relative;padding-left:58px}
.stepck{position:absolute;left:14px;top:16px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center;font-size:16px;color:transparent}
.stepck[aria-pressed="true"]{background:var(--glow);border-color:var(--glow);color:#2A1A00}
.stepcard h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stepcard p:last-child{margin-bottom:0}
.applesson{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.applesson .name{font-family:var(--display);font-size:19px;font-weight:700}
ol.steps{margin:6px 0 0;padding-left:22px}
ol.steps li{margin:7px 0}
.example,.avoid{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.example{background:var(--good-soft)}
.avoid{background:var(--bad-soft)}
.example b,.avoid b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.example b{color:var(--good)} .avoid b{color:var(--bad)}
.twister{font-family:var(--display);font-size:18px;font-weight:700;background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.donebtn{width:100%;border:none;border-radius:16px;padding:16px;font-family:var(--display);font-weight:700;font-size:19px;background:var(--glow);color:#2A1A00;margin-top:4px}
.donebtn.is-done{background:var(--indigo-soft);color:var(--indigo)}
.saved{font-size:13px;color:var(--muted);height:18px;margin-top:4px}

/* Plan */
.week{margin-bottom:24px}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week h2{font-size:23px}
.week>p{margin:6px 0 10px;color:var(--muted)}
.dayrow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.dayrow .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.dayrow .t{font-weight:700;display:block;line-height:1.3}
.dayrow .l{font-size:14px;color:var(--muted);display:block}
.dayrow .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line)}
.dayrow.done .ck{background:var(--glow);border-color:var(--glow)}
.dayrow.done .n{color:var(--amber)}
.rules{padding-left:20px;margin:6px 0 0}
.rules li{margin:6px 0}

/* Coach */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stats.four .stat b{font-size:22px}
.stat.warn b{color:var(--bad)} .stat.ok b{color:var(--good)}
.hl{background:var(--bg);border-radius:12px;padding:12px;line-height:1.7;margin-top:8px;white-space:pre-wrap}
mark{border-radius:4px;padding:0 2px;color:inherit}
mark.f{background:var(--mark-f)} mark.h{background:var(--mark-h)}
.tips{padding-left:20px;margin:8px 0 0} .tips li{margin:5px 0}
.aiout{margin-top:12px}
.aiscores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.aiscores div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.aiscores b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.rewrite{background:var(--good-soft);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.question{font-family:var(--display);font-size:21px;font-weight:700;background:var(--indigo-soft);color:var(--ink);border-radius:14px;padding:14px;margin:10px 0}
.chatlog{display:grid;gap:8px;margin:10px 0}
.msg{border-radius:14px;padding:10px 13px;white-space:pre-wrap;max-width:92%}
.msg.me{background:var(--indigo-soft);justify-self:end}
.msg.ai{background:var(--bg)}
.lbl{display:block;font-weight:700;margin:12px 0 6px}

/* Toolkit */
.timer{font-family:var(--display);font-weight:800;font-size:72px;text-align:center;letter-spacing:-.02em;line-height:1;margin:10px 0 12px;font-variant-numeric:tabular-nums}
.timer.over{color:var(--amber)}
.prompt{font-family:var(--display);font-size:22px;font-weight:700;min-height:2.6em;margin:10px 0 12px}
.tap{width:100%;aspect-ratio:2.4/1;border:none;border-radius:18px;background:var(--indigo-soft);color:var(--indigo);font-family:var(--display);font-weight:800;font-size:56px;touch-action:manipulation}
.tap span{display:block;font-family:var(--body);font-size:15px;font-weight:400}
.pacer{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 12px}
.orbbox{width:190px;height:190px;display:grid;place-items:center}
.orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 50% 40%, var(--glow), rgba(245,181,71,.25) 70%);transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out}
.pacertext{text-align:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);min-height:64px}
.pacertext small{display:block;font-size:30px}
.routine{background:var(--stage);color:var(--stage-ink);border-radius:16px;padding:16px;margin-top:10px}
.routine .rstep{font-family:var(--display);font-size:22px;font-weight:700;margin:6px 0}
.rbar{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:10px}
.rbar span{display:block;height:100%;background:var(--glow);width:0}

/* Videos */
.vid{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;text-decoration:none;background:var(--stage);color:var(--stage-ink);border-radius:14px;padding:10px;margin-top:6px}
.vthumb{aspect-ratio:16/10;border-radius:10px;background:radial-gradient(circle at 50% 25%, rgba(245,181,71,.75), rgba(245,181,71,.08) 72%), #2A2438;display:grid;place-items:center}
.vthumb span{width:34px;height:34px;border-radius:50%;background:var(--glow);display:grid;place-items:center;color:#2A1A00;font-size:14px}
.vid b{display:block;font-family:var(--display);font-size:17px;line-height:1.25;color:var(--stage-ink)}
.vid small{color:var(--stage-muted);font-size:13px}
.vid.watched .vthumb span{background:#6BCB8F;color:#0E2A18}
.watchfor{padding-left:20px;margin:6px 0 0}
.watchfor li{margin:4px 0}
.vrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center}
.link{color:var(--indigo);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.vday{font-size:14px;color:var(--muted);margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vday button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}

.tabs .sec{display:none}
.tabs.more .sec{display:inline-block}
body.focus .tabs .moretog{display:none}
.start ol{margin:6px 0 0;padding-left:22px}
.start li{margin:6px 0}

/* Practice gym */
.scenset{background:var(--bg);border-radius:12px;padding:12px 14px;margin:0 0 6px}
.opt:disabled,.tok:disabled{opacity:1}
.opt.meh{background:var(--mark-f);border-color:var(--glow)}
.toks{line-height:2.4}
.tok{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 7px;font-size:16px;margin:2px 0}
.tok.sel{background:var(--indigo-soft);border-color:var(--indigo)}
.tok.hit{background:var(--good-soft);border-color:var(--good)}
.tok.miss{border:2px dashed var(--glow)}
.tok.false{background:var(--bad-soft);border-color:var(--bad)}
.tele{font-family:var(--display);font-size:24px;line-height:1.6;background:var(--stage);color:var(--stage-ink);border-radius:14px;padding:16px}
.tele .w{transition:background .15s;border-radius:6px;padding:0 2px}
.tele .w.em{font-weight:800;color:var(--glow)}
.tele .w.now{background:var(--glow);color:#2A1A00}
.tele .w.past{opacity:.55}
.tele .pz{color:var(--glow);font-weight:800;opacity:.8}
.meter{position:relative;height:26px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;left:55%;width:30%;top:0;bottom:0;background:rgba(245,181,71,.25)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--indigo);border-radius:99px}
.trace{width:100%;height:90px;margin-top:8px;background:var(--bg);border-radius:10px}
.dice{display:grid;gap:8px}
.dice>div{background:var(--bg);border-radius:12px;padding:10px 12px}
.dice b{display:block;font-family:var(--display);font-size:19px}
.dice.rolling{animation:roll .25s ease-in-out}
@keyframes roll{50%{transform:rotate(-2deg) scale(.97);opacity:.4}}
.listen{margin-top:6px}

/* Me and focus */
input.full{width:100%}
select{padding:9px 10px}
.focusexit{display:none}
body.focus .tabs .tab[data-tab]:not([data-tab="today"]){display:none}
body.focus .tabs .focusexit{display:inline-block}
body.focus .lamps, body.focus .xp, body.focus .optcard{display:none}
body.focus .daynum{font-size:clamp(48px,16vw,80px)}

/* Masterclasses, wisdom, real world */
.smap{display:flex;gap:3px;height:10px;margin:14px 0 8px}
.smap span{border-radius:99px;background:var(--line);min-width:6px}
.smap span.on{background:var(--glow)}
.sci{background:var(--indigo-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.sci b{display:block;font-family:var(--display);color:var(--indigo);margin-bottom:2px}
.src{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.frame{background:var(--stage);color:var(--stage-ink);border-radius:12px;padding:12px 14px;margin:12px 0}
.frame b{display:block;font-family:var(--display);color:var(--glow);margin-bottom:4px}
.frame ol{margin:0;padding-left:20px}
.say{border-left:3px solid var(--glow);padding:3px 0 3px 12px;margin:6px 0;font-style:italic}
.idea{margin:10px 0}
.idea b{display:block}
.sect{display:block;font-family:var(--display);font-weight:700;font-size:17px;margin:14px 0 4px}
.rung{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.rung .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.rung.on .dot{background:var(--glow);border-color:var(--glow);color:#2A1A00}
.rung small{display:block;color:var(--muted);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:#F5B547;flex:0 0 auto}
.replist{list-style:none;padding:0;margin:10px 0 0}
.replist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.replist button{border:none;background:none;color:var(--muted);font-size:13px;padding:0 4px}
.donepill{font-size:13px;color:var(--good);font-weight:700}
.wkcard h3{font-size:19px}
.roleban{background:var(--indigo-soft);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}

/* Playbook */
details.fw{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
details.fw summary{cursor:pointer;list-style:none;padding:14px 16px}
details.fw summary::-webkit-details-marker{display:none}
details.fw summary h3{font-size:19px}
details.fw summary .sub{display:block;margin-top:2px}
details.fw .body{padding:0 16px 14px}

/* Progress */
.ranks{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rankname{font-family:var(--display);font-size:26px;font-weight:800}
.radarwrap{display:flex;justify-content:center}
.radar{width:100%;max-width:340px;height:auto}
.legend{display:flex;gap:14px;justify-content:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dim{margin:12px 0}
.dim b{display:block}
.dim .hint{font-size:14px;color:var(--muted)}
.rate{display:flex;gap:6px;margin-top:6px}
.rate button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-weight:700}
.rate button[aria-pressed="true"]{background:var(--glow);border-color:var(--glow);color:#2A1A00}
.bars{display:grid;gap:10px}

/* =========================================================
   DESIGN V2: the stage

details.deeper{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px}

/* =========================================================
   COURSE CONTENT
   ========================================================= */
const WEEKS = {
  1:{title:"Steady nerves, stronger voice", goal:"Calm your body before you speak and build a voice people lean in to. Targets nerves and a weak voice.",
     twisters:["Red leather, yellow leather.","Unique New York, you know you need unique New York."]},
  2:{title:"Clear thinking out loud", goal:"Give every answer a shape so you stop rambling, and learn to recover the moment your mind goes blank.",
     twisters:["The tip of the tongue, the teeth, the lips.","Peter Piper picked a peck of pickled peppers."]},
  3:{title:"Magnetic and memorable", goal:"Stories, humor, strong openings and eye contact, so people remember what you said and who said it.",

  4:{title:"Influence in the real world", goal:"Take it into conversations, meetings, pitches and interviews, then finish with a three-minute capstone talk.",

};

const WARMUP = [
  "Two physiological sighs: two short inhales through the nose, one long exhale through the mouth.",

];

const DAYS = [
 {d:1,w:1,t:"Your starting tape",lesson:"The Two-Minute Rule",cat:"Habit Building",
  big:"You can’t improve what you haven’t measured, and the habit matters more than any single session.",
  learn:["Most people quit speaking practice because it feels big. Make it tiny and attach it to something you already do every day.","Today you also capture your baseline recording. It will feel awkward. That awkwardness is exactly what this month removes."],
  steps:["Record a 2-minute phone video answering: “Tell me about yourself and something you care about.” One take, no retakes.","Watch it once. Count your fillers with the Filler counter in the Toolkit, then score it under Day 1 in Progress.","Write your daily anchor in today’s reflection: “After I ___, I do my 15 minutes.”"],
  ex:"“After I pour my morning coffee, I open Speak in 30 and do today’s session.”",
  avoid:"Retaking the video until it looks good. The honest first take is the whole point.",
  stretch:"Dictate the first 30 seconds of what you said into the AI coach for a baseline analysis.",
  mission:"Tell one person you’re doing a 30-day speaking challenge. Saying it out loud makes you more likely to finish.",
  reflect:"What did you notice first when you watched yourself? What’s your daily anchor?"},
 {d:2,w:1,t:"Calm the body first",lesson:"Talk Without the Fear",cat:"Speaking Confidence",
  big:"Nerves are physical before they’re mental, and long exhales are the fastest off-switch you have.",
  learn:["Speaking fear triggers the same fight-or-flight response as physical danger: racing heart, shallow breath, dry mouth. You can’t think your way out of it, but you can breathe your way down. Long exhales slow your heart rate.","Research on “anxiety reappraisal” suggests that telling yourself “I’m excited” works better than “calm down,” because excitement and anxiety feel almost identical in the body. You’re relabeling the energy, not fighting it."],
  steps:["Rate your nerves 1–10 at the thought of speaking to a full room.","Do 3 physiological sighs, then 2 minutes of box breathing with the Breathing pacer in the Toolkit.","Rate your nerves again. Say “I’m excited” out loud, then speak for 60 seconds on “the best meal I’ve ever had.”"],
  ex:"Before: nerves at 7. After 3 sighs and 2 minutes of box breathing: nerves at 4. That drop is a tool you now carry everywhere.",

  mission:"Before your next call or meeting today, do 3 physiological sighs.",
  reflect:"Your nerves before and after breathing? Where in your body do you feel nerves most?"},
 {d:3,w:1,t:"Stand like you mean it",lesson:"Confident Body Language",cat:"Speaking Confidence",

  learn:["Nervous energy leaks out as swaying, shifting weight, touching your face or hiding your hands. Confident speakers look grounded: feet planted, hands visible, gestures that start and stop with purpose.","Stillness isn’t stiffness. It’s moving only when the movement means something."],
  steps:["Stand with feet hip-width apart, weight even, shoulders down, hands loosely together at belly-button height. This is “home base.”","Record 60 seconds on “a skill I’m proud of.”","Watch it muted. Count sways, fidgets and face touches. Record again and cut that number in half."],
  ex:"Gesture outward on your important words, then return your hands to home base. Repeat.",
  avoid:"Crossed arms, hands in pockets, or gripping a pen or phone.",
  stretch:"Make one big, deliberate gesture on your most important sentence, then return to stillness.",
  mission:"In one conversation today, plant your feet and keep your hands visible.",
  reflect:"Which nervous habit showed up most on camera?"},
 {d:4,w:1,t:"Breathe from the belly",lesson:"The Magnetic Voice",cat:"Strong Presence",
  big:"A weak voice is usually a breathing problem, not a volume problem.",
  learn:["When you breathe into your chest, your voice comes from your throat: thin, tight, and it fades at the end of sentences.","Belly (diaphragmatic) breathing gives you a steady column of air, so your voice sounds fuller without straining. Breath is fuel. No breath, no power."],
  steps:["Hand on your belly. Breathe in so the hand moves out and your chest stays still. 5 slow breaths.","On one breath, count aloud 1 to 15 at a steady, full volume.","Read any paragraph aloud to a spot on the far wall. Project, don’t shout: the sound should come from your belly, not your throat."],
  ex:"Imagine your voice landing on the back wall, not dropping at your feet.",
  avoid:"Squeezing volume from your throat. If it scratches, you’re pushing from the wrong place.",
  stretch:"Count to 20 on one breath without the volume dropping on the last numbers.",
  mission:"In your next conversation, finish every sentence at full volume. No trailing off.",
  reflect:"How far did you count on one breath? Did your voice feel different?"},
 {d:5,w:1,t:"Five ways to say one line",lesson:"The Art of Vocal Control",cat:"Persuasion",
  big:"Monotone makes good content boring. Vocal variety is a skill you can drill.",
  learn:["You have five dials: pace, volume, pitch, pause and emphasis. Nervous speakers set them all to one position: fast, flat and same volume.","Interesting speakers move them. A reliable default: slow down and lower your pitch on important points, speed up a little on stories and lists."],
  steps:["Say “This is the most important decision we’ll make this year” five ways: slow, fast, quiet, loud, and with a 2-second pause before “most.”","Read a paragraph aloud, ending every sentence with your pitch going down.","Record it and mark one place where slowing down would add weight."],
  ex:"“This is the most… (pause) important decision we’ll make this year.” The pause makes them lean in.",
  avoid:"Uptalk: ending statements with a rising pitch, which makes them sound like questions.",
  stretch:"Read the same paragraph like a movie trailer narrator, then like a calm documentary.",
  mission:"Say one important sentence today slowly, with a pause before the key word.",
  reflect:"Which of the five dials do you use least?"},
 {d:6,w:1,t:"Delete the shrinking words",lesson:"The End of Sorry",cat:"Speaking Confidence",
  big:"Hedges tell people not to take you seriously before you’ve even made your point.",
  learn:["Words like “just,” “sorry,” “I think maybe,” “kind of” and “does that make sense?” soften every sentence. A little softening is polite. Constant softening sounds unsure.","You can be warm and direct at the same time: confidence lives in the wording, kindness lives in the tone."],
  steps:["Write down 3 things you said or messaged recently.","Cross out “just,” “sorry,” “I think maybe,” “kind of” and “does that make sense?”","Say each clean version aloud at full volume with a downward ending."],
  ex:"Before: “Sorry, I just think maybe we could kind of push the deadline?” After: “I recommend we move the deadline to Friday. That gives us time to test properly.”",
  avoid:"Replacing hedges with harshness. Direct isn’t rude.",
  stretch:"Paste today’s messages into the AI coach analyzer to catch hedges you didn’t notice.",
  mission:"Send one message today with zero hedges. Swap “Sorry for the late reply” for “Thanks for your patience.”",
  reflect:"Which hedge do you use most, and what will you say instead?"},
 {d:7,w:1,t:"Checkpoint 1",lesson:"Confidence on Demand",cat:"Speaking Confidence",check:true,
  big:"Re-recording the same prompt is the most honest mirror you have.",
  learn:["A week isn’t long, but small changes stack: calmer breath, a steadier stance, fewer hedges.","Today you compare, not judge. Find one thing that improved and one thing to fix next. That loop is how professional speakers train."],
  steps:["Do your warm-up, then 3 physiological sighs.","Re-record the Day 1 prompt: “Tell me about yourself and something you care about.” 2 minutes.","Score it under Day 7 in Progress, then take the Week 1 test."],
  ex:"“Improved: I stood still and my voice didn’t fade. Next fix: I said ‘just’ six times.”",
  avoid:"Comparing yourself to professional speakers. Compare yourself to your Day 1.",
  stretch:"Watch your Day 1 and Day 7 recordings back to back.",
  mission:"Teach one thing you learned this week to someone else.",
  reflect:"What improved? What’s the one fix for next week?"},

 {d:8,w:2,t:"One sentence first",lesson:"Clarity of Thought",cat:"Expressing Ideas",
  big:"Rambling happens when you start talking before you know your point.",
  learn:["Unclear speaking is usually unclear thinking. Before you explain, compress: what’s the one thing I want them to remember?","If you can say it in one sentence of 15 words or fewer, you’re ready. Everything else is support."],
  steps:["Open the prompt generator in the Toolkit.","For 5 prompts, say your point in 15 words or fewer before anything else.","Add exactly one reason. Then stop."],
  ex:"Prompt: “Is remote work better?” Point: “Remote work is better for focus but worse for building trust.” Reason: “Deep work happens at home; relationships grow in person.”",
  avoid:"Opening with background: “So, it’s kind of complicated, because…”",
  stretch:"Do it in 10 words.",
  mission:"In one conversation or email today, lead with your point.",
  reflect:"Was it harder to find the point, or to stop after the reason?"},
 {d:9,w:2,t:"The PREP frame",lesson:"Art of Speaking with Structure",cat:"Expressing Ideas",
  big:"A simple frame gives your brain a track to run on under pressure.",
  learn:["PREP means Point, Reason, Example, Point. It works for almost any question: meetings, interviews, opinions, updates.","Restating the point at the end gives you a clean finish. That’s where most people who ramble struggle: they don’t know how to stop."],
  steps:["Read the PREP card in the Playbook.","Answer 3 prompts in 60 seconds each using PREP. Use the 60-second timer.","Record the third and ask: could someone repeat my point after hearing it once?"],
  ex:"Point: “We should start meetings with the decision we need.” Reason: “It keeps everyone focused.” Example: “Last week’s planning meeting ran 40 minutes over because nobody knew the goal.” Point: “So, decision first, discussion second.”",
  avoid:"Giving three examples. One specific example beats three vague ones.",
  stretch:"Dictate one PREP answer into the AI coach and check its structure feedback.",
  mission:"Use PREP once in a real conversation or meeting today.",
  reflect:"Which part of PREP is hardest for you?"},
 {d:10,w:2,t:"Pause, don’t fill",lesson:"The Power of the Pause",cat:"Public Speaking",
  big:"A silent pause sounds confident. An “um” sounds unsure. They take the same amount of time.",
  learn:["Fillers appear when your brain needs a moment and your mouth is afraid of silence.","A 1–2 second pause feels long to you but sounds thoughtful to the audience. Pauses also add weight: pause before an important word and after a key point."],
  steps:["Speak for 90 seconds on a prompt while tapping the Filler counter (or record and count afterward).","Do it again. Each time a filler is coming, close your mouth and pause instead.","Write both counts in your reflection."],
  ex:"“The biggest lesson I learned… (pause) …was to ask for help earlier.”",
  avoid:"Swapping “um” for “so,” “basically” or “right?” Those are fillers too.",
  stretch:"Add a deliberate 2-second pause right after your main point.",
  mission:"In a conversation today, pause for a breath before answering a question.",
  reflect:"Filler count on the first try versus the second?"},
 {d:11,w:2,t:"When your mind goes blank",lesson:"Stop Going Blank",cat:"Speaking Confidence",
  big:"Going blank isn’t the problem. Not having a recovery plan is.",
  learn:["Everyone blanks, including professionals. Audiences rarely notice if you recover calmly.","The recovery: pause and breathe (it looks deliberate), repeat your last sentence (memory runs on momentum), then bridge with “The key point is…” to jump back to your main message."],
  steps:["Read the Blank recovery card in the Playbook.","Speak for 2 minutes on a prompt with a 30-second timer running. When it rings, stop mid-sentence and use the recovery.","Do it twice."],
  ex:"“…and that’s why the—” (pause, breathe) “So, as I said, the old process was slow. The key point is: every project needs one owner.”",
  avoid:"Apologizing: “Sorry, I lost my train of thought.” Just recover.",
  stretch:"Ask a friend to interrupt you randomly with “Wait, what?” and recover each time.",
  mission:"Put the three recovery steps on your phone’s lock screen or a sticky note.",
  reflect:"How did the recovery feel the second time compared with the first?"},
 {d:12,w:2,t:"Bottom line up front",lesson:"Cut to the Chase",cat:"Career Growth",
  big:"Busy listeners decide in the first 10 seconds whether to keep listening.",
  learn:["BLUF (bottom line up front) comes from military communication, where clarity matters. Give the conclusion first, then only the context they need.","It feels abrupt to you and respectful to them. Compressing also forces you to know what actually matters."],
  steps:["Pick a recent story or work update.","Tell it in 2 minutes, then 30 seconds, then 10 seconds. Conclusion first every time.","Notice what you cut. That’s usually what you ramble about."],
  ex:"Instead of “So on Monday we had a call with the client, and they mentioned…” say “The client approved the budget. Two small changes; I’ll send details today.”",
  avoid:"Telling events in order when the listener only needs the outcome.",
  stretch:"Write a 3-sentence email update using BLUF.",
  mission:"Start your next update or message with the bottom line.",
  reflect:"What did you cut that you usually include?"},
 {d:13,w:2,t:"Answer before you’re ready",lesson:"Answer Before You’re Ready",cat:"Speaking Confidence",
  big:"Impromptu speaking is a reflex, and reflexes come from reps.",
  learn:["You’ll never feel fully ready for a surprise question. So keep a structure ready instead of an answer.","What? (the fact), So what? (why it matters), Now what? (the next step). It turns panic into fill-in-the-blanks."],
  steps:["Set the prompt generator to “Interview & work.”","For 5 questions, start talking within 3 seconds using What? So what? Now what?","Keep each answer under 60 seconds."],
  ex:"“How’s the project going?” What: “We’re 80% done.” So what: “Testing found two bugs that could delay launch.” Now what: “I’ve added a developer, so we’re still on track for the 15th.”",
  avoid:"Waiting until you’ve figured out the perfect answer before you start.",
  stretch:"Use Sparring in the AI coach: get a surprise question and answer immediately.",
  mission:"Give your opinion in a group today before you overthink it.",
  reflect:"Which structure felt most natural under pressure?"},
 {d:14,w:2,t:"Checkpoint 2",lesson:"The Curse of Knowledge",cat:"Expressing Ideas",check:true,
  big:"Clarity means explaining at your listener’s level, not yours.",
  learn:["Once you know something, it’s hard to imagine not knowing it. That’s the curse of knowledge, and it’s why experts are often confusing.","The fix: plain words, concrete examples and comparisons to everyday things. If a 12-year-old would get it, a busy executive will too."],
  steps:["Explain your job or main interest to an imagined 12-year-old in 60 seconds. No jargon.","Re-record the Day 1 prompt, using PREP and pauses instead of fillers.","Score it under Day 14 in Progress, then take the Week 2 test."],
  ex:"“My job is like being a translator between the people who build the app and the people who use it.”",
  avoid:"Acronyms and jargon without explanation.",
  stretch:"Use one analogy (“It’s like…”) in your explanation.",
  mission:"Explain something from your work to someone outside your field.",
  reflect:"Compared with Days 1 and 7, what’s clearly better now?"},

 {d:15,w:3,t:"Find your style",lesson:"Unlock Your Speaking Persona",cat:"Speaking Styles",
  big:"You’re forgettable when you sound like everyone else. Know your natural style, then stretch it.",
  learn:["Most speakers lean toward one of four styles: the Analyst (data and logic), the Storyteller (narrative and emotion), the Motivator (energy and conviction) and the Teacher (step-by-step clarity).","Your natural style is your strength. Borrowing from the opposite style is what makes you versatile and memorable."],
  steps:["Decide your default style.","Deliver a 60-second message, “why people should read more,” in your default style.","Deliver it again in the opposite style. Record both."],
  ex:"Analyst: “Readers earn more and live longer, according to several studies.” Storyteller: “The book that changed my career cost me $12.”",
  avoid:"Believing one style is the right one. The best speakers blend.",
  stretch:"Blend all three: open as a Storyteller, prove as an Analyst, close as a Motivator.",
  mission:"Notice the style of someone you admire when they speak today.",
  reflect:"What’s your default style, and what’s your stretch style?"},
 {d:16,w:3,t:"Build a story bank",lesson:"The Art of Storytelling",cat:"Public Speaking",
  big:"People forget points but remember stories. A ready bank means you never have to reach for one.",
  learn:["A story doesn’t need drama. It needs shape: Situation (where and when), Problem (what was at stake), Turning point (what changed or what you did), Lesson (what it means for the listener).","Short, specific, personal stories beat long, impressive ones."],
  steps:["Write 3 stories in 4 bullets each: Situation, Problem, Turning point, Lesson.","Make one a success, one a failure, and one a funny moment.","Tell one aloud in 90 seconds. Save your bank in today’s reflection."],
  ex:"Situation: my first work presentation, 30 people. Problem: my laptop died two minutes in. Turning point: I closed it and just talked to them. Lesson: the slides were never the point; the message was.",
  avoid:"Announcing it: “I’m going to tell you a story.” Just start.",
  stretch:"Write a fourth story about a time you changed your mind.",
  mission:"Tell one of your stories in a real conversation.",
  reflect:"Your three stories, in one line each."},
 {d:17,w:3,t:"Stories that land",lesson:"The Story That Sells",cat:"Persuasion",
  big:"Detail and dialogue make a story feel lived, not summarized.",
  learn:["Summaries tell; stories show. Add three upgrades: one sensory detail, one line of dialogue and one honest emotion.","Then end with the point in one sentence, so the story serves a purpose."],
  steps:["Retell yesterday’s story with the three upgrades.","End with the lesson in a single sentence.","Record it and compare with yesterday’s version."],
  ex:"Summary: “The meeting went badly.” Story: “The room went silent. My manager put down her pen and said, ‘Walk me through that again.’ My face was burning.”",
  avoid:"Too much detail. One vivid detail beats five ordinary ones.",
  stretch:"Start the story in the middle of the action.",
  mission:"Tell a story to a friend that includes one line of dialogue.",
  reflect:"Which upgrade made the biggest difference?"},
 {d:18,w:3,t:"Lighten it up",lesson:"The Power of Humor",cat:"Small Talk",
  big:"You don’t need jokes. Honest, light observations make you warm and easy to listen to.",
  learn:["The most reliable humor in speaking comes from truth: honest exaggeration, relatable frustration, gentle self-deprecation, and the rule of three (two normal items, then a surprise).","Deliver the funny line, then pause. The pause is what gives people permission to laugh."],
  steps:["Pick a small frustration from this week.","Tell it in 45 seconds using honest exaggeration or a rule-of-three twist.","Pause and smile after the funny line. Don’t rush past it."],
  ex:"“This week I had three meetings, two deadlines, and one printer that has clearly chosen violence.”",
  avoid:"Humor at someone else’s expense, or jokes copied from the internet.",
  stretch:"Add one light moment to a story from your story bank.",
  mission:"Make one light, honest observation in a conversation today.",
  reflect:"What kind of humor feels natural to you?"},
 {d:19,w:3,t:"Hooks that grab",lesson:"Speak So People Listen",cat:"Public Speaking",
  big:"Your first sentence decides whether people tune in or tune out.",
  learn:["“Hi, my name is… and today I’m going to talk about…” wastes your most valuable 10 seconds.","Start with a hook instead: a question that makes them think, a surprising fact, a bold claim, or the first line of a story. Then introduce yourself or the topic."],
  steps:["Choose one topic you know well.","Write 3 openers: a question, a surprising fact or bold claim, and a one-sentence story.","Record all three. Keep the strongest for your capstone."],
  ex:"Question: “When did you last change your mind about something important?” Story: “Three years ago, I froze in front of 30 people.”",
  avoid:"Opening with an apology or a joke that isn’t connected to your topic.",
  stretch:"Try an “Imagine…” opener that paints a picture.",
  mission:"Open your next conversation with a real question instead of “How are you?”",
  reflect:"Which hook type fits you best?"},
 {d:20,w:3,t:"Eyes that connect",lesson:"Mastering Eye Contact",cat:"Strong Presence",
  big:"Eye contact turns a speech into a conversation, one person at a time.",
  learn:["Scanning the room looks nervous. Instead, give one complete thought to one person, then move to someone else.","In conversation, hold eye contact most of the time while listening and a bit less while talking. On video, the camera lens is their eyes."],
  steps:["In today’s conversations, hold eye contact for a full sentence before looking away.","On video calls, say your key sentences to the camera lens, not the screen.","Practice 60 seconds speaking straight into your phone’s camera lens."],
  ex:"One sentence, one person. Next sentence, next person.",
  avoid:"Staring without blinking, or sweeping the room like a lighthouse.",
  stretch:"Put a small sticker next to your webcam as a reminder.",
  mission:"In one conversation, hold eye contact right through the end of your sentence.",
  reflect:"When was eye contact hardest for you?"},
 {d:21,w:3,t:"Checkpoint 3",lesson:"Certainty That Shows",cat:"Strong Presence",check:true,
  big:"Put weeks 1–3 together in one piece of speaking.",
  learn:["Certainty isn’t knowing everything. It’s committing to what you say.","Downward endings, no hedges, deliberate pauses and a clear point all signal it. Today you combine your best hook, one story and one clear point."],
  steps:["Plan a 2-minute talk: hook, story, point.","Warm up, then record it in one take.","Score it under Day 21 in Progress and take the Week 3 test."],
  ex:"Hook (question) → story from your bank → “So here’s what I believe…” → pause → close.",
  avoid:"Writing a word-for-word script. Know your structure, not every sentence.",
  stretch:"Deliver it standing, to an imagined audience of 50.",
  mission:"Share your best story with someone new.",
  reflect:"What’s the biggest change since Day 1?"},

 {d:22,w:4,t:"Open any conversation",lesson:"Openers That Work",cat:"Small Talk",
  big:"Confidence grows fastest with real people, not mirrors.",
  learn:["The best opener is an observation about your shared situation plus a question. It’s low pressure and easy to answer.","Then follow your curiosity: build your next question from their answer, not from a list."],
  steps:["Start one real conversation today with an observation plus a question.","Ask 2 follow-up questions built from their answers.","Afterward, write down one thing you learned about them."],
  ex:"With a colleague: “You looked deep in that spreadsheet. What are you working on?” At an event: “First time at one of these? What brought you here?”",
  avoid:"Rapid-fire interview questions without sharing anything about yourself.",
  stretch:"Go deeper using FORD topics: family, occupation, recreation, dreams.",
  mission:"The drill is the mission today: talk to one new person.",
  reflect:"How did they respond? What would you do differently?"},
 {d:23,w:4,t:"Read the room",lesson:"Read the Room",cat:"Small Talk",
  big:"Charismatic speakers adjust to their audience in real time.",
  learn:["Leaning in, nodding and laughter mean keep going. Phones out, crossed arms and glazed eyes mean change something: slow down, ask a question, tell a story or wrap up.","Reading the room is two moves: notice, then make one adjustment."],
  steps:["In a meeting or group today, notice energy signals.","Change one thing: your pace, your volume, or ask the group a question.","Write down what you noticed and what you changed."],
  ex:"“I can see a few tired faces, so let me skip to the one slide that matters.”",
  avoid:"Taking low energy personally. People are often tired, not bored of you.",
  stretch:"Read the mood of a room within 30 seconds of walking in.",
  mission:"The drill is the mission today: notice and adjust once.",
  reflect:"What did you notice that you usually miss?"},
 {d:24,w:4,t:"Speak first in meetings",lesson:"Say It First",cat:"Career Growth",
  big:"The longer you wait to speak, the harder it gets and the less weight it carries.",
  learn:["Early contributions shape the discussion and make every later one easier.","You don’t need a brilliant idea. A clear question, a summary or a PREP point works. Prepare one contribution in advance."],
  steps:["Prepare one PREP contribution for your next meeting.","Say it within the first 5 minutes.","No meeting today? Record a 60-second, bottom-line-first update to your manager."],
  ex:"“Before we dive in, can we agree on the one decision we need today?”",
  avoid:"Waiting for the perfect moment. It doesn’t come.",
  stretch:"Summarize at the end of the meeting: “So, we’ve agreed…”",
  mission:"Speak in the first 5 minutes of any group conversation.",
  reflect:"How did it feel to speak early?"},
 {d:25,w:4,t:"Persuade with respect",lesson:"The Psychology of Influence",cat:"Persuasion",
  big:"Good persuasion makes it easy to say yes to something that’s good for them.",
  learn:["People decide for their reasons, not yours. A strong pitch has five parts: Problem, Cost of doing nothing, Idea, Benefit to them, and a clear Ask.","Classic influence principles like reciprocity, social proof and consistency help, but only when used honestly."],
  steps:["Choose something real you want: an idea, a request, a change.","Write a 60-second pitch with the five parts.","Record it, with your voice going down at the ask."],
  ex:"“Onboarding takes 3 weeks. That’s 3 weeks of lost productivity per hire. A buddy system could cut it to 1, so new people contribute faster. Can we pilot it with the next two hires?”",
  avoid:"A vague ending like “Let me know what you think.” Make one specific ask.",
  stretch:"Dictate your pitch into the AI coach with “Pitch” selected.",
  mission:"Make one small request today using Problem, Benefit, Ask.",
  reflect:"What’s the benefit to them, in their words?"},
 {d:26,w:4,t:"Handle pushback",lesson:"Handle Any Objection",cat:"Persuasion",
  big:"Objections are interest in disguise. Calm answers beat clever ones.",
  learn:["When someone pushes back, the instinct is to defend. Instead: Acknowledge, Ask, Answer, Check.","Asking first often reveals the real concern isn’t what it seemed."],
  steps:["Write 3 objections to yesterday’s pitch.","Answer each one: Acknowledge, Ask, Answer, Check.","Say each answer aloud in under 45 seconds."],
  ex:"“That’s a fair concern. What worries you most about the cost? … The pilot costs nothing but two hours of a senior person’s time per week. Does that address it?”",
  avoid:"“Yes, but…” It cancels your acknowledgment. Pause instead.",
  stretch:"Use Sparring in the AI coach with “Skeptical manager” selected.",
  mission:"Next time someone disagrees with you, ask a question before you respond.",
  reflect:"Which objection was hardest to answer?"},
 {d:27,w:4,t:"Own the Q&A",lesson:"Handle Questions like a Pro",cat:"Public Speaking",
  big:"Tough questions are where people judge your confidence most.",
  learn:["A pause before answering signals thought, not weakness. Restate the question to buy time and confirm you understood, then give one point and one example.","If you don’t know, say so and say what you’ll do. For interview questions, use STAR."],
  steps:["Write 5 tough questions you might face in an interview or at work.","Answer each in 30 seconds: pause, restate, then one point and one example.","Redo the answer you liked least."],
  ex:"“I don’t know yet. I’ll check with the data team and get back to you by Friday.”",
  avoid:"Bluffing. A confident “I don’t know, here’s what I’ll do” beats a shaky guess.",
  stretch:"Answer one question using STAR: Situation, Task, Action, Result.",
  mission:"Ask the AI coach for an interview question and answer it out loud.",
  reflect:"Which kind of question throws you most?"},
 {d:28,w:4,t:"Adapt to anyone",lesson:"Adaptive Charisma",cat:"Speaking Styles",
  big:"Mastery is changing your delivery without changing who you are.",
  learn:["Same message, different audiences. A manager wants the bottom line and numbers. A friend wants the story. A large audience needs more energy, bigger pauses and simpler sentences.","Charisma is presence plus warmth, adjusted to whoever is in front of you."],
  steps:["Take one 45-second message.","Deliver it to your manager, then a friend, then a room of 100.","Record all three and listen for real differences in pace and volume."],
  ex:"Manager: “We’re 2 days behind; here’s the fix.” Friend: “You won’t believe what happened at work.” Room: “Two days. (pause) That’s all it took to…”",
  avoid:"Becoming a different person. Adjust volume and detail, not your values.",
  stretch:"Add a fourth audience: a skeptical client.",
  mission:"Notice how you speak differently to two different people today.",
  reflect:"Which version felt most like you?"},
 {d:29,w:4,t:"Build your capstone",lesson:"Build a Memory Palace",cat:"Memory",
  big:"Speaking without notes frees your eyes and hands for the audience.",
  learn:["The memory palace links each part of your talk to a place you know well. Your brain is excellent at remembering locations.","Walk through the rooms in your mind and each one cues the next section. Memorize the structure plus your first and last lines, not every word."],
  steps:["Outline a 3-minute talk on something you care about: hook, 3 points, one story, a closing call to action.","Place each part in a room of your home: front door is the hook, kitchen is point 1, and so on.","Walk the rooms in your head and rehearse once without notes. This day may take 25 minutes."],
  ex:"Front door: my opening question. Kitchen: point 1. Living room: my laptop story. Bedroom: the close.",
  avoid:"Memorizing word for word. Forget one word and the whole thing collapses.",
  stretch:"Rehearse it out loud while walking.",
  mission:"Tell someone what your capstone talk is about.",
  reflect:"Your capstone topic and its one-sentence point?"},
 {d:30,w:4,t:"Capstone talk",lesson:"Own the Attention",cat:"Public Speaking",check:true,
  big:"Show yourself how far you’ve come.",
  learn:["Today you use everything: breathing to calm, a belly voice, stillness and eye contact, a hook, structure, a story, pauses instead of fillers, and a clear close.","Don’t aim for perfect. Aim for present."],
  steps:["Full warm-up, then 3 physiological sighs.","Record your 3-minute talk without notes, in one take.","Score it under Day 30, take the final test, then watch Day 1 and Day 30 back to back."],
  ex:"Hook → point 1 → story → point 2 → point 3 → callback to your hook → call to action → pause → “Thank you.”",
  avoid:"Restarting when you stumble. Recover and keep going, like on a real stage.",
  stretch:"Deliver it live to a friend, family member or colleague.",
  mission:"Choose your next 30-day focus from the Library.",
  reflect:"What changed most? What will you keep doing?"}
];

const QUIZ = {
 1:[{q:"Your heart is racing right before you speak. What’s the fastest fix?",o:["Tell yourself to calm down","Two short inhales through the nose, one long exhale, a few times","Drink a coffee","Skip the warm-up and start"],a:1,e:"Long exhales activate the body’s calming system. You can’t argue with adrenaline, but you can breathe it down."},
    {q:"Which self-talk tends to help more under nerves?",o:["“I’m calm.”","“I’m excited.”","“Don’t mess this up.”","Nothing, just ignore it"],a:1,e:"Excitement and anxiety feel similar in the body, so relabeling as excitement is easier than forcing calm."},
    {q:"Where should a strong speaking voice come from?",o:["The throat","The chest","Belly breathing","Speaking faster"],a:2,e:"Diaphragmatic breathing gives your voice a steady supply of air, so it sounds full without strain."},
    {q:"Ending statements with a rising pitch tends to sound…",o:["Friendly and confident","Unsure, like a question","More professional","Louder"],a:1,e:"Downward endings sound certain. Rising endings make statements sound like questions."},
    {q:"Which version sounds most confident?",o:["“Sorry, I just think maybe we could…”","“I kind of feel like we should…”","“I recommend we move the launch to Friday.”","“Does that make sense?”"],a:2,e:"No hedges, no apology, a clear recommendation."}],
 2:[{q:"What does PREP stand for?",o:["Prepare, Rehearse, Engage, Perform","Point, Reason, Example, Point","Pause, Repeat, Explain, Pause","Problem, Result, Evidence, Plan"],a:1,e:"State the point, give one reason, one example, then restate the point to finish cleanly."},
    {q:"Your mind goes blank mid-sentence. Best first move?",o:["Apologize and start over","Pause, breathe, and repeat your last sentence","Say “um” until it comes back","Skip to the end"],a:1,e:"A pause looks deliberate, and repeating your last line restarts your memory’s momentum."},
    {q:"The best replacement for “um” is…",o:["“So”","“Basically”","A silent pause","Speaking faster"],a:2,e:"A pause takes the same time as a filler but sounds thoughtful instead of unsure."},
    {q:"BLUF means…",o:["Bottom line up front","Build, lead, unify, finish","Be loud, use force","Brief list, useful facts"],a:0,e:"Give the conclusion first, then only the context the listener needs."},
    {q:"“What? So what? Now what?” is best for…",o:["Writing long reports","Answering surprise questions","Telling jokes","Small talk openers"],a:1,e:"It gives you an instant structure when you have no time to prepare."}],
 3:[{q:"The four beats of a story in this course are…",o:["Hook, body, close, Q&A","Situation, Problem, Turning point, Lesson","Who, what, when, where","Intro, joke, fact, thanks"],a:1,e:"Situation, Problem, Turning point, Lesson. Short, specific and personal."},
    {q:"What makes a story feel lived instead of summarized?",o:["More dates and numbers","A sensory detail, a line of dialogue and an honest feeling","Making it longer","Telling it faster"],a:1,e:"Show, don’t tell. One vivid detail beats five ordinary ones."},
    {q:"On a video call, where do you deliver your key sentences?",o:["The other person’s face on screen","Your notes","The camera lens","Your own video tile"],a:2,e:"The lens is their eyes. Looking at the screen looks like looking down."},
    {q:"Which is the strongest way to open a talk?",o:["“Hi, today I’m going to talk about…”","An apology for being nervous","A question, a surprising fact, or the first line of a story","Reading your agenda"],a:2,e:"The first 10 seconds decide attention. Hook first, introduce second."},
    {q:"Humor in speaking works best when…",o:["You use jokes from the internet","It’s an honest observation, followed by a pause","It targets someone in the room","You explain why it’s funny"],a:1,e:"Truth is relatable, and the pause gives people permission to laugh."}],
 4:[{q:"Someone objects to your idea. What do you do first?",o:["Defend it immediately","Say “Yes, but…”","Acknowledge the concern","Change the subject"],a:2,e:"Acknowledge, Ask, Answer, Check. Acknowledging lowers defenses on both sides."},
    {q:"Speaking early in a meeting tends to…",o:["Look pushy","Shape the discussion and make it easier to speak again","Make no difference","Only matter for managers"],a:1,e:"The longer you wait, the harder it gets. Early contributions carry more weight."},
    {q:"The pitch order in this course is…",o:["Ask, Idea, Benefit, Problem, Cost","Idea, Ask, Problem","Problem, Cost, Idea, Benefit, Ask","Benefit, Benefit, Ask"],a:2,e:"Start with their problem and the cost of doing nothing, then your idea, their benefit and one clear ask."},
    {q:"You get a tough question you can’t fully answer. Best move?",o:["Bluff confidently","Pause, restate the question, and say what you know and what you’ll do","Ignore it","Apologize at length"],a:1,e:"A confident “I don’t know yet, here’s what I’ll do” beats a shaky guess."},
    {q:"Adaptive charisma means…",o:["Becoming a different person for each audience","Changing your delivery to fit the audience while keeping your core self","Always speaking loudly","Using the same talk for everyone"],a:1,e:"Adjust pace, detail and energy, not your values."}]
};

const DAYCACHE = {};
function getDay(d){
  if (d <= 30) return DAYS[d-1];
  if (DAYCACHE[d]) return DAYCACHE[d];
  let x;
  if (d >= 87) x = Object.assign({w:13}, GRAD[d-87]);
  else if (d === 60) x = Object.assign({}, CHECK60);
  else {
    const w = 5 + Math.floor((d-31)/7), dow = (d-31)%7, p = PATH2.find(q=>q.w===w);
    const M = p.mcs.map(id=>MC.find(m=>m.id===id));
    let plan;
    if (M.length === 2) plan = [["learn",M[0]],["apply",M[0]],["learn",M[1]],["apply",M[1]],["integrate"],["project"],["review"]];
    else { const ap = M[1].rp ? M[1] : M[2]; plan = [["learn",M[0]],["apply",M[0]],["learn",M[1]],["learn",M[2]],["apply",ap],["project"],["review"]]; }
    x = buildDay(plan[dow][0], plan[dow][1], p, M); x.w = w;
    const m0 = plan[dow][1];
    if (m0 && x.sub === "Masterclass") Object.assign(x, {case:m0.case, ba:m0.ba, pro:m0.pro, crit:m0.crit});
    else if (m0) Object.assign(x, {crit:m0.crit});
    else if (x.sub === "Integration") x.crit = M.map(m=>m.crit[0]);
    else if (x.sub === "Project") x.crit = ["I finished at least two steps","I ticked them off in the Real world tab","I showed someone what I’ve built"];
    else if (x.sub === "Review") x.crit = ["I counted my reps and my average confidence","I attempted this week’s ladder rung","I chose one thing to change next week"];
  }
  x.d = d; DAYCACHE[d] = x; return x;
}
let MCFIRST = null;
function mcFirstDay(id){
  if (!MCFIRST){ MCFIRST = {}; for (let d=31; d<=86; d++){ const x = getDay(d); if (x.sub==="Masterclass" && !MCFIRST[x.mcid]) MCFIRST[x.mcid] = d; } }
  return MCFIRST[id] || 999;
}

function addDays(n){ const t = new Date(); t.setDate(t.getDate()+n); return iso(t); }
function recallPool(){
  const reached = firstOpenDay(), items = [];
  const list = arr => `<ol class="steps">${arr.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  PLAYBOOK.forEach((p,i)=>{ if (reached > PB_INTRO[i]) items.push({id:"pb"+i, q:`Recall the steps of “${p.t}”. When do you use it?`, a:list(p.s)+`<p class="sub" style="margin:6px 0 0">Use it for: ${p.use}</p>`}); });
  [1,2,3,4].forEach(w=>{ if (reached > w*7) QUIZ[w].forEach((q,i)=>items.push({id:`q${w}-${i}`, q:q.q, a:`<b>${q.o[q.a]}</b><p class="sub" style="margin:6px 0 0">${q.e}</p>`})); });
  MC.forEach(m=>{ if (state.mc[m.id] || reached > mcFirstDay(m.id)) items.push({id:"mc-"+m.id, q:`From “${m.t}”: what are the steps of ${m.frame.n}?`, a:list(m.frame.s)}); });
  Object.entries(DAYSCI).forEach(([d,id])=>{ if (reached > +d){ const w = WISDOM.find(x=>x.id===id); items.push({id:"w-"+id, q:`What does the research say: “${w.t}”?`, a:`${w.insight}<span class="src">${w.src}</span>`}); } });
  const seen = new Set(); return items.filter(i=>!seen.has(i.id) && seen.add(i.id));
}
function dueRecall(){
  const today = iso(new Date());
  const pool = recallPool();
  const due = pool.filter(i=>state.srs[i.id] && state.srs[i.id].due <= today).sort((a,b)=>state.srs[a.id].due < state.srs[b.id].due ? -1 : 1);
  const fresh = pool.filter(i=>!state.srs[i.id]);
  return {list: due.concat(fresh.slice(0, Math.max(0, 5 - due.length))), total: pool.length};
}
function gradeRecall(id, ok){
  const s = state.srs[id] || {b:0};
  const b = ok ? Math.min((s.b||0)+1, 5) : 0;
  state.srs[id] = {b, due: addDays([1,2,4,8,16,32][b])};
  save();
}
let recallShown = false;
function recallHTML(){
  const {list, total} = dueRecall();
  if (!total) return `<p style="margin:0">Nothing to review yet. From Day 6, earlier lessons come back here right when you’re about to forget them. That timing is what makes them stick.</p>`;
  if (!list.length) return `<p style="margin:0">All caught up. Your next reviews are scheduled for the coming days.</p><p class="note" style="margin:6px 0 0">${Object.keys(state.srs).length} of ${total} ideas in your memory system.</p>`;
  const it = list[0];
  return `<p class="note" style="margin:0 0 6px">${list.length} to review today</p><div class="question" style="font-size:19px">${it.q}</div>
    ${recallShown ? `<div class="example" style="margin-top:0"><b>Answer</b>${it.a}</div><div class="row" style="margin-top:10px"><button class="btn small amber" data-grade="1" data-id="${it.id}">I remembered</button><button class="btn small ghost" data-grade="0" data-id="${it.id}">I missed it</button></div>`
      : `<p class="sub">Say your answer out loud first.</p><button class="btn small" id="recallShow">Show answer</button>`}`;
}

/* ---------- Flexible session ---------- */
const TIMES = [[5,"5 min"],[20,"20 min"],[30,"30 min"],[45,"45 min"],[60,"60 min"],[90,"60+ min"]];
function sessionBlocks(x, mins, rel){
  const d = x.d, B = [];
  const mini = mins === 5;
  B.push({k:"warm", t:"Warm up your voice", m:2, core:true});
  if (mins >= 30) B.push({k:"recall", t:"Recall", m:2});
  if (!mini) B.push({k:"learn", t:"Learn the idea", m:6, core:true});
  if (!mini) B.push({k:"tryit", t:"Try it", m:3});
  if (mins >= 45) B.push({k:"deepen", t:VIDEOS[d] ? "Watch like a coach" : "Go deeper", m:VIDEOS[d] ? Math.max(10, Math.min(20, VIDEOS[d].min||10)) : 10});
  B.push({k:"drill", t:mini ? "One quick drill" : "Drill it out loud", m:mini ? 3 : 9, core:true});
  if (mins >= 30) B.push({k:"smart", t:"Smart rep", m:5});
  if (mins >= 30) B.push({k:"levelup", t:"Level up", m:3});
  if (mins >= 45) B.push({k:"coach", t:"Coach check", m:5});
  if (mins >= 60) B.push({k:"impromptu", t:"Impromptu round", m:5});
  if (mins >= 60) B.push({k:"roleplay", t:rel && rel.rp ? "AI roleplay" : "Stage rep", m:10});
  if (mins >= 90) B.push({k:"artic", t:"Articulation lab", m:5});
  if (mins >= 90 && d < TOTAL_DAYS) B.push({k:"ahead", t:"Get ahead", m:15});
  return B;
}
function blockBody(k, x, rel, mini){
  const d = x.d;
  if (k === "warm") { const v = WARMUPS[d % WARMUPS.length]; return `<p class="sub" style="margin:0 0 6px">${v.n}</p><ol class="steps">${v.s.map(w=>`<li>${w}</li>`).join("")}</ol>${[TWISTERS[d % TWISTERS.length], TWISTERS[(d*7+3) % TWISTERS.length]].map(t=>`<div class="twister">${t}</div>`).join("")}`; }
  if (k === "recall") return `<div id="recallBox">${recallHTML()}</div>`;
  if (k === "smart") { const sp = smartPick(d, gymFor(x)[0]); return `<p style="margin:0 0 6px">${sp.w ? `Your coach sees <b>${SKILLNAME[sp.k]}</b> as your weakest skill right now (${sp.w.v}/100, from ${sp.w.cnt} signals). This rep targets it.` : "Calibrate your coach: this recording gives it its first real data about how you speak."}</p><p class="note" style="margin:0 0 8px">${sp.w ? SMART_TIP[sp.k] : "Speak for 30 seconds or more about anything you like."}</p><div id="smartInline"></div>`; }
  if (k === "tryit") return `<p class="sub" style="margin:0 0 8px">${gymLabel(gymFor(x))}. Interactive, about four minutes.</p><div id="gymInline"></div>`;
  if (k === "learn") {
    const deepOpen = ((state.pref && state.pref.mins) || 20) >= 45;
    const extra = sciBox(d) + (x.case ? `<div class="case"><b>Picture this</b>${x.case}</div>` : "") + (x.pro ? `<div class="pro"><b>Coach’s note</b>${x.pro}</div>` : "");
    let h = x.learn.map(p=>`<p>${p}</p>`).join("") + contentBlocks({ba:x.ba}) + (extra ? `<details class="deeper" ${deepOpen?"open":""}><summary>Go deeper: ${[sciBox(d)?"the science":"", x.case?"a story":"", x.pro?"a coach’s note":""].filter(Boolean).join(", ").replace(/, ([^,]*)$/, " and $1")}</summary>${extra}</details>` : "");
    if (x.frame) h += `<div class="frame"><b>${x.frame.n}</b><ol>${x.frame.s.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
    if (x.lesson) h += `<div class="applesson"><span class="sub">Go deeper in your app</span><div class="name">${x.lesson}</div><span class="sub">Explore › ${x.cat}</span></div>`;
    else if (x.mcid) h += `<div class="row" style="margin-top:10px"><button class="btn small ghost" data-openmc="${x.mcid}">Open the full masterclass</button>${x.projid?`<button class="btn small ghost" data-openproj="${x.projid}">Open the project</button>`:""}</div>`;
    return h;
  }
  if (k === "deepen") {
    const v = VIDEOS[d];
    if (v) { const w = !!state.watched[d]; return vidLink(v, w) + `<b style="display:block;margin-top:12px">Watch like a coach</b><ul class="watchfor">${v.watch.map(s=>`<li>${s}</li>`).join("")}</ul>${v.note?`<p class="note" style="margin:6px 0 0">${v.note}</p>`:""}<div class="vrow"><button class="btn small ${w?"ghost":""}" data-watched="${d}">${w?"Watched ✓":"Mark as watched"}</button></div>`; }
    if (rel && d <= 30) return `<p>Go beyond today with a related masterclass: <b>${rel.t}</b>.</p>${rel.ideas.slice(0,2).map(([b,t])=>`<div class="idea"><b>${b}</b>${t}</div>`).join("")}<div class="frame"><b>${rel.frame.n}</b><ol>${rel.frame.s.map(s=>`<li>${s}</li>`).join("")}</ol></div><button class="btn small ghost" data-openmc="${rel.id}">Open the full masterclass</button>`;
    const q = x.vq || ("public speaking " + (rel ? rel.t.toLowerCase() : x.t.toLowerCase()));
    return `<p>Find one strong video on this theme and study it with the five steps in the Videos tab.</p><a class="link" href="${ytSearch(q)}" target="_blank" rel="noopener noreferrer">Find videos on “${q}”</a>`;
  }
  if (k === "drill") {
    if (mini) return `<p>${x.steps[0]}</p><p class="note" style="margin:0">Busy day? This keeps your streak alive. Do the full day when you can.</p>`;
    return `<ol class="steps">${x.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      ${dupEx(x) ? "" : `<div class="example"><b>Example</b>${x.ex}${listenBtn(x.ex)}</div>`}<div class="avoid"><b>Avoid</b>${x.avoid}</div>${critHTML(d, x)}
      <div class="row" style="margin-top:12px"><button class="btn small ghost" data-go="toolkit">Timer and prompts</button>
      ${x.rp && x.mcid ? `<button class="btn small amber" data-rp="${x.mcid}">Start the AI roleplay</button>` : `<button class="btn small ghost" data-go="coach">Analyze with AI coach</button>`}
      ${x.projid ? `<button class="btn small ghost" data-openproj="${x.projid}">Open the project</button>` : ""}</div>`;
  }
  if (k === "impromptu") return `<p>Three prompts, 60 seconds each, starting within three seconds. Use What? So what? Now what?</p><div class="prompt" id="impP" style="min-height:0">${PROMPTS.everyday[d % PROMPTS.everyday.length]}</div><div class="row"><button class="btn small" id="impNew">Next prompt</button><button class="btn small ghost" data-go="toolkit">Open the timer</button></div>`;
  if (k === "coach") return `<p>Dictate what you said in today’s drill into the AI coach. Look at the fillers, hedges and the rewrite, then say the stronger version out loud once.</p><button class="btn small" data-go="coach">Open the AI coach</button>`;
  if (k === "levelup") return `<p style="margin:0">${x.stretch}</p>`;
  if (k === "roleplay") return rel && rel.rp ? `<p>Practise “${rel.t}” against a realistic AI character. Answer out loud first, then type or dictate. Type “feedback” for coaching.</p><button class="btn small amber" data-rp="${rel.id}">Start the roleplay</button>`
      : `<p>Stand up and give a 3-minute talk on today’s topic to an imagined audience of 50. Record it in one take, then run it through the AI coach.</p><button class="btn small ghost" data-go="coach">Open the AI coach</button>`;
  if (k === "artic") { const a = ARTIC[d % ARTIC.length], b = ARTIC[(d+3) % ARTIC.length]; return `<ol class="steps"><li>${a}</li><li>${b}</li></ol><div class="twister">${TWISTERS[(d*3) % TWISTERS.length]}</div>`; }
  if (k === "ahead") { const n = getDay(d+1); return `<p>Preview tomorrow: <b>Day ${n.d}: ${n.t}</b>. Read the idea and try the first drill step now; tomorrow you’ll go deeper. Also aim for three real-world reps today.</p><button class="btn small ghost" data-goday="${n.d}">Preview Day ${n.d}</button>`; }
  return "";
}

 feedback:{case:"A manager replaced “Great job!” with specific notes like “Your opening question got the client talking for five minutes. Do that every time.” Within a month her team started asking her for feedback instead of avoiding it.",

   pro:"Give praise in the same specific format as corrective feedback. Specific praise tells people exactly what to repeat.",
   crit:["I named a specific situation","I described behavior, not character","I ended with a clear request"]},
 negotiate:{case:"Offered $68,000, Arjun said: “I’m excited about this role. Based on the scope and what similar roles pay, I was expecting closer to $76,000. How much flexibility is there?” Then he stopped talking. The next day the recruiter came back with $73,000 and a signing bonus.",
   ba:{b:"“Um, is there any chance it could maybe be a bit higher? If not, that’s fine.”",a:"“I was expecting closer to $76,000. How much flexibility is there?”"},
   pro:"Anchor with a precise number rather than a round one. Precise figures signal that you’ve done your research.",
   crit:["I knew my walk-away before starting","I stated a number, then stayed silent","I traded instead of conceding"]},
 assert:{case:"Every Friday, Jordan’s manager handed him last-minute tasks. He started saying, “I can do that. To fit it in, which of these three should I move to Monday?” Within a month the last-minute requests halved, because they now had a visible cost.",
   ba:{b:"“Sorry, I really can’t, I have so much going on, I’m so sorry…”",a:"“I can’t take that on this week. I could look at it Monday.”"},
   pro:"With a manager, don’t just say no. Show the trade-off: “Yes, and which of these should I drop?” protects your time without sounding unwilling.",
   crit:["I gave a short reason, not a long excuse","I apologized no more than once","I offered an alternative"]},

   pro:"When asked a yes-or-no question, start with yes or no, then give the reason. Senior people notice who answers the actual question.",

   pro:"If a number is too big to feel, make it small: per day, per person. If it’s too small to matter, make it big: per year, across the company.",
   crit:["Every number had a “so what”","I made at least one number human","My slide titles were full sentences"]},
 lead:{case:"Announcing a reorganization, a director began with the why: “Customers wait six days for answers. That’s too long.” Then she asked, “What am I missing?” Two team members raised a scheduling problem she hadn’t seen, and the plan improved before launch.",
   ba:{b:"“Starting Monday, we’re switching to the new process. Please follow it.”",a:"“Customers wait six days for answers. Starting Monday, we’re trying a process to cut that in half. What am I missing?”"},
   pro:"Repeat the why more often than feels necessary. By the time you’re tired of saying it, people are just starting to remember it.",

 eq:{case:"A client called, furious about a delay. Instead of explaining, Tom said, “It sounds like this puts your launch at real risk.” The client paused, said “Yes, exactly,” and the rest of the call was about solutions instead of blame.",

   crit:["I named the emotion before solving","I paused before reacting","I kept the person separate from the problem"]},
 inner:{case:"Before every presentation, an engineer used to think, “Don’t screw this up.” He switched to, “Alex, you know this better than anyone in the room. Help them understand it.” His reviews improved, but the bigger change was that he began volunteering to present.",

 brand:{case:"Asked “What do you do?” at a dinner, Leah used to say, “I’m in compliance,” and the conversation died. She switched to, “I help hospitals avoid million-dollar mistakes.” The next question was always “How?”, and one of those conversations led to a job offer.",
   ba:{b:"“I’m a senior coordinator in the operations team.”",a:"“I help hospital teams launch new services on time.”"},

 network:{case:"After a conference, Sofia sent every new contact a note within 24 hours: “Great meeting you. Here’s the article on hospital scheduling I mentioned.” Six months later, two of them referred her for roles.",
   ba:{b:"“Nice to meet you. Let’s stay in touch!” (No follow-up.)",a:"“Great talking about scheduling. I’ll send you that article tonight.” (Sent that evening.)"},

 interview:{case:"Asked about a conflict, one candidate told a two-minute STAR story: a launch at risk, her role, three specific actions and a launch two days early. She was the only candidate who gave a number in her result, and the panel remembered it.",

["done","doneAt","steps","scores","notes","quiz","watched","ladder","proj","mc","pref","srs","mini","profile","gym","crit"].forEach(k=>{ if (!state[k] || typeof state[k] !== "object") state[k] = {}; });
state.coach = +state.coach || 0;

let viewDay = firstOpenDay(), scoreDay = 1, quizWeek = 1, quizAns = {};
let remote = null, writing = false, pending = false, saveTimer = null;
let sampleFn = null, aiReady = false;

function firstOpenDay(){ for (let d=1; d<=TOTAL_DAYS; d++) if (!state.done[d]) return d; return TOTAL_DAYS; }
function doneCount(){ return Object.keys(state.done).filter(d=>+d>=1 && +d<=TOTAL_DAYS).length; }
function xp(){
  let x = doneCount()*100;
  CHECKS.forEach(d=>{ const s = state.scores[d]; if (s && DIMS.every(m=>s[m.k])) x += 50; });
  Object.values(state.quiz).forEach(q=>{ x += q >= 4 ? 75 : (q > 0 ? 25 : 0); });
  x += Math.min(state.coach, 40) * 15;
  x += Object.keys(state.watched).length * 10;
  x += Object.keys(state.ladder).length * 30;
  x += Math.min(state.reps.length, 150) * 5;
  x += Object.keys(state.mc).length * 60;
  PROJECTS.forEach(p=>{ if (projDone(p)) x += 150; });
  Object.values(state.steps).forEach(st=>{ ["recall","tryit","smart","deepen","impromptu","coach","levelup","roleplay","artic","ahead"].forEach(k=>{ if (st && st[k]) x += 10; }); });
  Object.values(state.srs).forEach(r=>{ x += (r.b||0) * 2; });
  const G = state.gym || {};
  x += Object.values(G.scen||{}).reduce((a,v)=>a+v*10,0) + (gymCount("spot") + gymCount("order") + gymCount("rewrite") + gymCount("meter"))*10 + Math.min(gymCount("dice"),60)*5 + gymCount("tele")*5;
  Object.values(state.crit).forEach(c=>{ x += Object.keys(c||{}).length * 2; });
  x += Math.min(state.delivery.length, 60)*15 + state.human.length*40;
  x += Object.values(state.notes).filter(n=>n && n.trim().length > 10).length * 20;
  return x;
}
function rankOf(x){ let cur = RANKS[0], next = null; for (let i=0;i<RANKS.length;i++){ if (x >= RANKS[i][0]) { cur = RANKS[i]; next = RANKS[i+1] || null; } } return {cur, next}; }
function streak(){
  const days = new Set([...Object.values(state.doneAt), ...Object.values(state.ladder), ...state.reps.map(r=>r.at), ...Object.keys(state.mini)]); let c = 0; const d = new Date();
  if (!days.has(iso(d))) d.setDate(d.getDate()-1);
  while (days.has(iso(d))) { c++; d.setDate(d.getDate()-1); }
  return c;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  if (remote) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800); }
}
async function flush(){
  if (!remote) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await remote.set({...state, updated:Date.now()}); setSync(true); }
  catch(e) { setSync(false); }
  writing = false;
  if (pending) { pending = false; flush(); }
}
function setSync(ok){ $("#sync").textContent = ok ? "Your progress saves to your account, so it follows you across devices." : "Your progress saves on this device."; }
function setDone(d, on){
  if (on) { state.done[d] = true; state.doneAt[d] = iso(new Date()); }
  else { delete state.done[d]; delete state.doneAt[d]; }
}

function renderHero(lit){
  const x = getDay(viewDay);
  const hd = $("#heroDay"); hd.innerHTML = "";
  const s = document.createElement("small");
  s.textContent = state.done[viewDay] ? "Completed" : (viewDay === firstOpenDay() ? "You’re on" : "Viewing");
  hd.append(s, document.createTextNode("Day " + viewDay));
  $("#heroTheme").textContent = "Month " + Math.ceil(viewDay/30) + ", week " + x.w + ": " + WEEKS[x.w].title;
  const st = streak();
  $("#heroStreak").textContent = (st ? "🔥 " + st + "-day streak" : "Start your streak today") + "  ·  " + doneCount() + "/90";
  const box = $("#lamps"); box.innerHTML = "";
  const ph = Math.ceil(viewDay/30), s0 = (ph-1)*30; let phDone = 0;
  for (let d=s0+1; d<=s0+30; d++){
    if (state.done[d]) phDone++;
    const l = document.createElement("button");
    l.className = "lamp" + (state.done[d] ? " done" : "") + (d === viewDay ? " current" : "") + (d === lit ? " lit" : "");
    l.setAttribute("aria-label", "Day " + d + (state.done[d] ? ", done" : ""));
    l.addEventListener("click", ()=>{ viewDay = d; showTab("today"); renderAll(); window.scrollTo({top:0}); });
    box.appendChild(l);
  }
  const pr = phDone/30, beam = document.getElementById("beamPoly"), pool = document.getElementById("poolEl");
  if (beam) beam.style.opacity = (0.3 + 0.7*pr).toFixed(2);
  if (pool) { pool.setAttribute("rx", String(Math.round(42 + 50*pr))); pool.style.opacity = (0.4 + 0.6*pr).toFixed(2); }
  $("#heroPhase").textContent = "Month " + ph + ": " + phDone + " of 30 footlights lit";
  if (lit) { const sg = document.querySelector(".stage"); sg.classList.remove("flare"); void sg.offsetWidth; sg.classList.add("flare"); }
  const x2 = xp(), r = rankOf(x2);
  const pct = r.next ? ((x2 - r.cur[0]) / (r.next[0] - r.cur[0])) * 100 : 100;
  $("#xpFill").style.width = Math.min(100, pct) + "%";
  $("#xpRank").textContent = r.cur[1] + " · " + x2 + " XP";
  $("#xpNext").textContent = r.next ? (r.next[0] - x2) + " XP to " + r.next[1] : "Top rank reached";
}

function vidLink(v, watched){

function videoCard(d){
